/**
 * Segundo campo: las PERSONAS de las empresas elegidas, agrupadas por empresa y
 * con selección múltiple. Misma lógica que la empresa: si una empresa tiene un
 * solo contacto viene puesto; si tiene varios, se elige aquí.
 */
function repContactPicker(o){
  const ui    = o.ui || {};
  const comps = o.companies.map(id => DB.salesReps.find(r => r.id === id)).filter(Boolean);
  const term  = (ui.q || '').trim().toLowerCase();
  const all   = [];
  comps.forEach(r => (r.contacts || []).forEach(k => all.push({ k:k, r:r })));
  const names = o.ids.map(id => (all.find(x => x.k.id === id) || {}).k).filter(Boolean).map(k => k.name);
  const groups = comps.map(r => {
    const list = (r.contacts || []).filter(k => !term ||
      (k.name+' '+(k.role||'')+' '+r.name).toLowerCase().indexOf(term) !== -1);
    if (!list.length) return '';
    return (comps.length > 1 ? '<div class="rp-sep">'+esc(r.name.toUpperCase())+'</div>' : '')+
      list.map(k => {
        const on = o.ids.indexOf(k.id) !== -1;
        return '<button data-act="'+o.pfx+'Pick" data-v="'+k.id+'">'+
          '<span class="cbx '+(on?'on':'')+'">'+(on?ic('check',13):'')+'</span>'+
          '<span style="flex:1">'+esc(k.name)+'</span>'+
          '<span style="font-size:12px;color:var(--text2)">'+esc(k.role || '')+'</span></button>';
      }).join('');
  }).join('');
  const off = !comps.length;
  return '<div class="rp-wrap"><div style="display:flex;align-items:flex-end;gap:10px">'+
      '<div style="flex:1;min-width:0">'+field('Sales Rep',
        '<button class="csel" data-act="'+o.pfx+'Open" title="'+esc(names.join(', '))+'"'+(off?' disabled':'')+'>'+
          '<span>'+esc(names.join(', '))+'</span>'+ic('chev-d',15)+'</button>', 'person', { disabled:off })+'</div>'+
      '<button class="icon-btn" data-act="'+o.pfx+'Clear"'+(o.ids.length ? '' : ' disabled')+
        ' title="Remove sales reps" style="margin-bottom:16px">'+ic('close',20)+'</button>'+
    '</div>'+
    (ui.open && !off
      ? '<div class="menu rp-menu">'+
          '<div class="menu-search">'+ic('search',15)+
            '<input placeholder="Search" value="'+esc(ui.q || '')+'" data-act="'+o.pfx+'Q"></div>'+
          '<div class="menu-list" style="max-height:200px">'+
            (groups || '<div class="menu-empty">No matches</div>')+'</div>'+
        '</div>'
      : '')+
  '</div>';
}

/** Deja los contactos del lead al día con sus empresas: se quitan los de empresas
 *  que ya no están y, de una empresa nueva con un solo contacto, se pone ese. */
function syncLeadContacts(d, before){
  const comps = d.salesRepIds || [];
  let ks = (d.salesRepContactIds || []).filter(id =>
    comps.some(cid => ((DB.salesReps.find(r => r.id === cid) || {}).contacts || []).some(k => k.id === id)));
  comps.filter(cid => (before || []).indexOf(cid) === -1).forEach(cid => {
    const cs = (DB.salesReps.find(r => r.id === cid) || {}).contacts || [];
    if (cs.length === 1 && ks.indexOf(cs[0].id) === -1) ks.push(cs[0].id);
  });
  d.salesRepContactIds = ks;
}

/** Representantes de una cotización (varios). `q.rep` queda como el primero, por compatibilidad. */
function quoteReps(q){ return q.reps || (q.rep ? [q.rep] : []); }

/**
 * Comisión con varios representantes: cada empresa aporta el % de SU tramo, se
 * suman y el total se reparte a partes iguales entre los representantes.
 * Con uno solo, su parte es su propio porcentaje.
 */
function repCommissionShares(q){
  const reps  = quoteReps(q).map(id => DB.salesReps.find(r => r.id === id)).filter(Boolean);
  const own   = reps.map(r => commissionFor(r, tierBaseUsd(q)));
  const total = own.reduce((a, x) => a + x.pct, 0);
  const share = reps.length ? Math.round(total / reps.length * 100) / 100 : 0;
  return reps.map((r, i) => ({ rep:r, own:own[i].pct, tier:own[i].tier, share:share, total:total }));
}

/**
 * Representante por defecto del lead: si el estado tiene exactamente uno,
 * viene puesto. Si hay varios, se deja vacío para que se elija.
 */
function autoRep(){
  const d = S.modal.data;
  const reps = repsForState(d.state, d.country);
  /* Solo se propone; quien rellena el lead puede quitarlo o cambiarlo. */
  d.salesRepIds = reps.length === 1 ? [reps[0].id] : [];
  syncLeadContacts(d, []);
}

function modalLead(m){
  const d      = m.data;
  const client = DB.clients.find(c => c.id === d.clientId);
  const states = STATES[d.country] || [];
  const cities = DB.cities.filter(c => c.active);

  const plus = (act, on, title) =>
    '<button class="icon-btn'+(on?' add':'')+'" data-act="'+act+'"'+(on?'':' disabled')+
      ' title="'+title+'" style="margin-bottom:16px">'+ic('plus',20)+'</button>';

  return '<div class="scrim" data-act="close"><div class="modal" data-stop>'+
    '<div class="modal-head"><button class="icon-btn" data-act="close" style="color:var(--primary)">'+
      ic('close',20)+'</button><h3>New Lead</h3></div>'+
    '<div class="modal-body">'+
      '<div class="fgrid">'+
        '<div class="span2">'+field('Name *', inp('name', d.name), 'edit')+'</div>'+
        field('Account Manager *', sel('am',
          [{v:'',t:''}].concat(DB.staff.map(s => ({v:s,t:s}))), d.am), 'person')+
        field('Precon Manager *', sel('pm',
          [{v:'',t:''}].concat(DB.staff.map(s => ({v:s,t:s}))), d.pm), 'person-gear')+
      '</div>'+
      /* Cliente y contacto llevan su "+" para crear el que falte, como en la captura. */
      '<div class="fgrid">'+
        '<div style="display:flex;align-items:flex-end;gap:10px">'+
          '<div style="flex:1;min-width:0">'+field('Client *', sel('clientId',
            [{v:'',t:''}].concat(DB.clients.map(c => ({v:c.id,t:c.name}))), d.clientId), 'building')+'</div>'+
          plus('newClientFromLead', true, 'New client')+
        '</div>'+
        '<div style="display:flex;align-items:flex-end;gap:10px">'+
          '<div style="flex:1;min-width:0">'+field('Client contact', sel('contactId',
            [{v:'',t:''}]
              .concat(client ? client.contacts.map(k => ({v:k.id,t:k.name})) : []),
            d.contactId, !client), 'people', { disabled:!client })+'</div>'+
          plus('newContactFromLead', !!client, 'New contact')+
        '</div>'+
        /* Todo arranca vacío, como en la captura: solo la etiqueta flotante. */
        field('Country', sel('country',
          [{ v:'', t:'' }].concat(Object.keys(STATES).map(c => ({v:c,t:c}))), d.country), 'globe')+
        field('State', sel('state',
          [{ v:'', t:'' }]
            .concat(states.map(s => ({v:s,t:s}))), d.state, !d.country), 'pin', { disabled:!d.country })+
        field('City', sel('city',
          [{v:'',t:''}].concat(cities.map(c => ({v:c.name,t:c.name}))), d.city), 'building')+
        '<div></div>'+   /* los dos campos de Sales Rep van juntos en su propia fila */
        /* Territorio primero: si el estado tiene un solo representante viene puesto; si
           tiene varios, no se elige ninguno y el desplegable los muestra. "Show all sales
           reps" amplía a todos, se pueden marcar varios y la "x" quita la selección. */
        '<div>'+repPicker({ ids:d.salesRepIds || [], state:d.state, country:d.country, ui:m.repUi, pfx:'leadRep',
          label:'Sales Rep Company', icon:'building' })+'</div>'+
        /* Segundo campo: la persona. Una empresa con un solo contacto lo trae puesto. */
        '<div>'+repContactPicker({ ids:d.salesRepContactIds || [], companies:d.salesRepIds || [],
          ui:m.ctUi, pfx:'leadCt' })+'</div>'+
      '</div>'+
      '<div class="fgrid">'+
        field('Invitation Date *', inp('inv', d.inv, 'date'), 'cal')+
        field('Due Date *', inp('due', d.due, 'date'), 'cal')+
        '<div class="span2">'+field('Notes', inp('notes', d.notes), 'note')+'</div>'+
        '<div class="span2">'+field('Bid documents', inp('docs', d.docs), 'doc')+'</div>'+
      '</div>'+
      (m.error ? '<div class="alert err">'+ic('warn',18,'ai')+'<div>'+esc(m.error)+'</div></div>' : '')+
      '<div class="req">* indicates required field</div>'+
    '</div>'+
    '<div class="modal-foot">'+
      '<button class="btn btn-flat" data-act="saveLead">Save</button></div>'+
  '</div></div>';
}

function modalClient(m){
  const d = m.data;
  /* La ciudad sale del catálogo, no de texto libre: es la que decide qué
     representantes se ofrecen para este cliente en el formulario de leads. */
  const cityOpts = DB.cities.filter(c => c.active || c.id === d.cityId)
                     .map(c => ({ v:c.id, t:c.name + (c.active?'':' (inactive)') }));
  return '<div class="scrim" data-act="close"><div class="modal" data-stop>'+
    '<div class="modal-head"><button class="icon-btn" data-act="close" style="color:var(--primary)">'+ic('close',20)+'</button>'+
      '<h3>'+(m.kind === 'editClient' ? 'Edit Client' : 'New Client')+'</h3></div>'+
    '<div class="modal-hero"><span class="circle">'+ic('building',24)+'</span></div>'+
    '<div class="modal-body"><div class="fgrid">'+
      '<div class="span2">'+field('Name *', inp('name', d.name), 'note')+'</div>'+
      '<div class="span2">'+field('Address', inp('address', d.address), 'map')+'</div>'+
      field('Country *', sel('country',[{v:'United States',t:'United States'},{v:'Colombia',t:'Colombia'}], d.country),'globe')+
      /* Desplegable, no texto: de este estado depende qué representante
         se propone luego en el lead. */
      field('State', sel('state',
        [{ v:'', t:'' }]
          .concat((STATES[d.country]||[]).map(s => ({ v:s, t:s }))), d.state, !d.country),
        'pin', { disabled:!d.country })+
      field('City *', sel('cityId', [{v:'',t:''}].concat(cityOpts), d.cityId),'building')+
      field('Language *', sel('language',[{v:'US',t:'English'},{v:'ES',t:'Español'}], d.language),'people')+
      field('Currency *', sel('currency',[{v:'USD',t:'USD'},{v:'COP',t:'COP'}], d.currency),'dollar')+
      field('Margin *', inp('margin', d.margin,'number'),'percent')+
      field('Accessories Margin *', inp('accMargin', d.accMargin,'number'),'percent')+
      field('Commission *', inp('commission', d.commission,'number'),'percent')+
      '<div class="span2">'+field('Note', inp('note', d.note),'note')+'</div>'+
      '<div class="span2" style="display:flex;align-items:center;gap:10px;font-size:13px">'+
        '<button class="cbx '+(d.standard?'on':'')+'" data-act="togFlag" data-v="standard">'+
        (d.standard?ic('check',13):'')+'</button><span>Standard client</span></div>'+
      '<div class="span2" style="display:flex;align-items:center;gap:10px;font-size:13px">'+
        '<button class="cbx '+(d.directedQuotes?'on':'')+'" data-act="togFlag" data-v="directedQuotes">'+
        (d.directedQuotes?ic('check',13):'')+'</button><span>Enabled Directed Quotes for Client</span></div>'+
    '</div>'+
    (m.error ? '<div class="alert err">'+ic('warn',18,'ai')+'<div>'+esc(m.error)+'</div></div>' : '')+
    '<div class="req">* indicates required field</div></div>'+
    '<div class="modal-foot">'+
      '<button class="btn btn-flat" data-act="saveClient">Save</button></div>'+
  '</div></div>';
}

    '<h4>Client and contact can be created inline</h4><ul>'+

      'the new client selected and the location filled.</li>'+
    '<li>The <b>+</b> beside <i>Client contact</i> opens the same <i>New Contact</i> modal used elsewhere, and '+
      'leaves the new contact selected.</li>'+
    '<li>Nothing typed in the lead is lost in either case.</li></ul>'+
    '<h4>Open questions</h4><ul>'+
    '<li>Does a lead with a sales rep earn commission, or only the quote that comes out of it?</li>'+
    '<li>Can two reps cover the same state long-term, or is the dropdown a stopgap until territories are '+
      'exclusive? <span class="pill chg">Confirm</span></li></ul>',
  portal:
    '<h4>Two behaviors, one component</h4><ul>'+

    '<li><b>Sales Rep:</b> filter bar, plus a <i>Directed quote</i> block in the modal.</li>'+

    '<h4>The board filter</h4><ul>'+

    '<li>Prototype reading: <b>All</b> / <b>Client&rsquo;s own</b> (created by the client themselves) / '+
      '<b>Directed by me</b>. <span class="pill chg">Confirm</span></li></ul>'+
    '<h4>Mandatory chain</h4><ul>'+
    '<li><code>Rep &rarr; Assigned client &rarr; Contact &rarr; Quote</code></li>'+
    '<li>The contact dropdown stays disabled until a client is picked, and lists contacts of <b>that</b> client '+
      'only.</li></ul>'+

    '<li>Percentages are <b>never</b> read from the payload: they come from the rep&rsquo;s own record.</li>'+

};
SPEC.reps = SPEC.clients;

/* ==========================================================================
   11. RENDER RAÍZ
   ========================================================================== */
function render(){
  renderProto();
  let inner;
  if (S.app === 'portal'){
    inner = railPortal() + viewPortal();
  } else if (S.internalView === 'board'){
    inner = railInternal() + (S.openQuote ? viewQuote() : viewBoard());
  } else if (S.internalView === 'leads'){
    inner = railInternal() + viewLeads();
  } else {
    inner = railInternal() + viewClients();
  }
  $('#app').innerHTML = shell(inner);
  renderOverlay();
}

/* ==========================================================================
   12. EVENTOS
   ========================================================================== */
/** Vuelca lo tecleado en el modal a S.modal.data antes de repintar. */
function keepDraft(){
  const f = readModalFields();
  Object.assign(S.modal.data, f);
  if (f.threshold !== undefined)
    S.modal.data.tiers = { thresholdUsd:f.threshold, belowPct:f.belowPct, abovePct:f.abovePct };
  S.modal.data.addClient = '';
}

/** Solo el modal principal: el de contacto se lee aparte para no mezclarlos. */
function readModalFields(){
  const out = {};
  document.querySelectorAll('#mmodal [data-f]').forEach(el => { out[el.getAttribute('data-f')] = el.value; });
  return out;
}
function readContactFields(){
  const out = {};
  document.querySelectorAll('#cmodal [data-f]').forEach(el => { out[el.getAttribute('data-f')] = el.value; });
  return out;
}
/** Lo tecleado en el modal de contacto, con las claves del borrador. */
function contactDraft(){
  const f = readContactFields();
  return { name:f.kName, email:f.kEmail, cc1:f.kCc1, phone1:f.kPhone1, cc2:f.kCc2, phone2:f.kPhone2,
           country:f.kCountry, state:f.kState, cityId:f.kCityId, role:f.kRole, note:f.kNote };
}

document.addEventListener('click', function(ev){
  const stop = ev.target.closest('[data-stop]');
  const el   = ev.target.closest('[data-act]');
  const act  = el ? el.getAttribute('data-act') : null;
  const v    = el ? el.getAttribute('data-v')   : null;

  /* Cualquier clic fuera de un menú abierto lo cierra. */
  let closed = false;
  if (S.menu && act !== 'menu' && !ev.target.closest('.menu')){
    S.menu = null; closed = true;
    if (!el){ render(); return; }
  }
  /* Marcar opciones o escribir en el buscador no debe cerrarlo. */
  if (S.mbMenu && act !== 'mbMenu' && !ev.target.closest('.menu')){
    S.mbMenu = null; closed = true;
    if (!el){ render(); return; }
  }
  if (!el){ return; }

  /* Los buscadores se atienden en 'input'. Un clic en ellos no repinta:
     el campo se volvería a crear, perdería el foco y lo tecleado no llegaría. */
  if (el.tagName === 'INPUT' && el.type !== 'checkbox' && el.type !== 'radio'){
    if (closed){
      const sel = '[data-act="'+act+'"]'+(v ? '[data-v="'+v+'"]' : '');
      render();
      const n = document.querySelector(sel); if (n) n.focus();
    }
    return;
  }

  /* cerrar al pulsar el scrim, pero no dentro del modal */
  if (act === 'close' && el.classList.contains('scrim') && stop) return;

  switch(act){
    /* Al cerrar, si había un modal debajo se vuelve a él. */
    case 'close': S.modal = S.modalStack.pop() || null; break;
    case 'menu':  S.menu = (S.menu === v ? null : v); break;

    /* ---- vista de cotización ---- */
    case 'openQuote':  S.openQuote = v; S.quoteTab = 'general'; S.giRepMenu = null; break;
    case 'closeQuote': S.openQuote = null; break;
    case 'qtab':       S.quoteTab = v; break;

    /* ---- recargos ---- */
    case 'surNew': S.surModal = { data:{ label:'', pct:'' } }; break;
    case 'surClose': {
      if (el.classList.contains('scrim') && stop) return;   /* return, no break: si no, el render() del final repinta y mata el clic */
      /* Al editar no hay botón Save: Close deja aplicado lo tecleado. */
      if (S.surModal.edit){
        const f = {};
        document.querySelectorAll('#surmodal [data-f]').forEach(e => { f[e.getAttribute('data-f')] = e.value; });
        if (f.sPct === '' || isNaN(Number(f.sPct))){ S.surModal.error = 'Enter a percentage.'; break; }
        if (!S.surModal.auto && (!f.sDetails || !f.sDetails.trim())){ S.surModal.error = 'Details is required.'; break; }
        const s = surchargesOf(boardQuote(S.openQuote)).find(x => x.id === S.surModal.edit);
        if (s){ s.pct = Number(f.sPct); if (!S.surModal.auto) s.label = f.sDetails.trim(); }
      }
      S.surModal = null;
      break; }
    case 'surDelete': {
      const q = boardQuote(S.openQuote);
      q.surcharges = surchargesOf(q).filter(s => s.id !== S.surModal.edit);
      S.surModal = null;
      break; }
    case 'surSave': {
      const f = {};
      document.querySelectorAll('#surmodal [data-f]').forEach(e => { f[e.getAttribute('data-f')] = e.value; });
      if (!f.sDetails || !f.sDetails.trim()){ S.surModal.error = 'Details is required.'; break; }
      if (f.sPct === '' || isNaN(Number(f.sPct))){ S.surModal.error = 'Enter a percentage.'; break; }
      const q = boardQuote(S.openQuote);
      surchargesOf(q).push({ id:'sur_'+Math.random().toString(36).slice(2,7),
        label:f.sDetails.trim(), pct:Number(f.sPct) });
      S.surModal = null;
      break; }
    /* El lápiz abre el recargo en su propio diálogo, como en el software. */
    case 'surEdit': {
      const s = surchargesOf(boardQuote(S.openQuote)).find(x => x.id === v);
      if (s) S.surModal = { edit:s.id, auto:!!s.auto, data:{ label:s.label, pct:s.pct } };
      break; }

    /* ---- filtros del Main Board ---- */
    case 'mbMenu': S.mbMenu = (S.mbMenu === v ? null : v); break;
    /* El menú NO se cierra al elegir: hay que poder marcar varios seguidos. */
    case 'mbPick': {
      const k = el.getAttribute('data-k');
      const list = S.mbSel[k];
      const i = list.indexOf(v);
      if (i === -1) list.push(v); else list.splice(i,1);
      break; }
    case 'mbClear':
      S.mbSel[v] = [];
      S.mbQuery[v] = '';
      break;

    /* ---- contactos: mismo modal para cliente, representante y alta en curso ---- */

    case 'cNew':
      S.contactModal = { kind:el.getAttribute('data-kind'), ownerId:el.getAttribute('data-owner'),
        data:{ name:'', email:'', cc1:'+1', phone1:'', cc2:'+1', phone2:'',
               country:'United States', state:'', cityId:'', role:'', note:'' } };
      break;
    case 'cClose':
      if (act === 'cClose' && el.classList.contains('scrim') && stop) return;
      S.contactModal = null;
      break;
    case 'cSaveContact': {
      const f = readContactFields();
      if (!f.kName || !f.kName.trim()){ S.contactModal.error = 'Name is required.'; break; }
      if (!f.kEmail || !f.kEmail.trim()){ S.contactModal.error = 'Email is required.'; break; }
      if (!f.kState){ S.contactModal.error = 'State is required.'; break; }
      const city = DB.cities.find(x => x.id === f.kCityId);
      const rec = { id:'ct_'+Math.random().toString(36).slice(2,7),
        name:f.kName.trim(), email:f.kEmail.trim(), role:f.kRole || '',
        phone1:(f.kPhone1 ? f.kCc1+' '+f.kPhone1.trim() : ''),
        phone2:(f.kPhone2 ? f.kCc2+' '+f.kPhone2.trim() : ''),
        country:f.kCountry, state:f.kState, cityId:f.kCityId, city:city?city.name:'',
        note:f.kNote || '' };
      /* 'draft' = el representante aún no existe; el contacto va al borrador. */
      if (S.contactModal.kind === 'draft'){
        keepDraft();
        const list = S.modal.data.contacts = S.modal.data.contacts || [];
        if (list.some(k => k.name.toLowerCase() === rec.name.toLowerCase())){
          S.contactModal.error = 'That contact is already on the list.'; break; }
        list.push(rec);
      } else {
        const owner = ownerOf(S.contactModal.kind, S.contactModal.ownerId);
        if (owner.contacts.some(k => k.name.toLowerCase() === rec.name.toLowerCase())){
          S.contactModal.error = 'That contact already exists in this record.'; break; }
        owner.contacts.push(rec);
        S.cSearch = '';
        /* Si vino del "+" del lead, queda elegido en el acto. */
        if (S.contactModal.fromLead && S.modal) S.modal.data.contactId = rec.id;
      }
      S.contactModal = null;
      break; }
    case 'cDel': {
      const kind = el.getAttribute('data-kind');
      if (kind === 'draft'){
        /* Todavía no existe el representante: el contacto vive en el borrador. */
        keepDraft();
        S.modal.data.contacts = (S.modal.data.contacts || []).filter(k => k.id !== v);
      } else {
        const owner = ownerOf(kind, el.getAttribute('data-owner'));
        if (owner) owner.contacts = owner.contacts.filter(k => k.id !== v);
      }
      break; }


    case 'role':  S.portalRole = v; S.filterClient='all'; S.filterOrigin='all'; S.toast=null; break;
    case 'view':  S.internalView = v; break;
    case 'ctab':  S.clientsTab = v; S.masterQuery=''; resetContacts(); break;
    case 'dtab':  S.detailTab = v; break;
    case 'rtab':  S.repTab = v; resetContacts(); break;
    case 'selClient': S.selClient = v; S.detailTab='general'; resetContacts(); break;
    case 'selRep':    S.selRep = v; S.repTab='general'; resetContacts(); break;
    case 'notes': S.notesOpen = !S.notesOpen; break;
    /* Reiniciar también borra las solicitudes de prueba enviadas desde el portal. */
    case 'reset':
      try { localStorage.removeItem(REQ_KEY); } catch(e){}
      DB = clone(SEED); S.openQuote = null; S.toast = null; publishRepFlags(); break;

    case 'toggleClient': {
      const c = DB.clients.find(x => x.id === v); if (c) c.active = !c.active; break; }
    case 'toggleRep': {
      const r = DB.salesReps.find(x => x.id === v); if (r) r.active = !r.active; break; }
    case 'toggleDirected': {
      const c = DB.clients.find(x => x.id === v); if (c) c.directedQuotes = !c.directedQuotes; break; }
    case 'toggleQuoteAsClient': {
      const r = DB.salesReps.find(x => x.id === v);
      if (r){ r.quoteAsClient = !r.quoteAsClient; publishRepFlags(); }
      break; }

    case 'newRep':
      S.modal = { kind:'newRep', data:{ name:'', email:'', phone:'', cityId:DB.cities[0].id,
        currencyId:DB.currencies[0].id, languageId:DB.languages[0].id, active:true, standard:false, quoteAsClient:true, country:'United States', note:'', margin:40, accMargin:15, commission:1, clientIds:[], territory:[],
        contacts:[], ctName:'', ctRole:'', ctEmail:'',
        tiers:{ thresholdUsd:1000000, belowPct:3.5, abovePct:2.0 } } };
      break;
    case 'editRep': {
      const r = DB.salesReps.find(x => x.id === v);
      S.menu = null;
      S.modal = { kind:'editRep', id:r.id,
        data:Object.assign(clone(r), { clientIds: clientsOfRep(r.id).map(c => c.id),
          ctName:'', ctRole:'', ctEmail:'' }) };
      break; }

    /* La "x" repinta el modal, así que hay que rescatar antes lo ya tecleado
       — incluidos los tramos, que se leen de data.tiers al renderizar. */
    case 'repDelClient': {
      keepDraft();
      S.modal.data.clientIds = (S.modal.data.clientIds || []).filter(x => x !== v);
      break; }
    case 'repStates': {
      const rep = DB.salesReps.find(x => x.id === v);
      if (rep) S.modal = { kind:'repStates', repId:rep.id,
        data:{ country:(territoryOf(rep)[0] || {}).country || rep.country,
               territory:territoryOf(rep).map(t => ({ country:t.country, state:t.state })) } };
      break; }
    case 'repStatesSave': {
      const rep = DB.salesReps.find(x => x.id === S.modal.repId);
      if (!S.modal.data.territory.length){ S.modal.error = 'Add at least one territory.'; break; }
      rep.territory = S.modal.data.territory.slice();
      S.modal = null;
      break; }
    /* Quitar una división (clave «país|división») sin tocar las demás. */
    case 'repDelState': {
      keepDraft();
      S.modal.data.territory = (S.modal.data.territory || []).filter(t => t.country+'|'+t.state !== v);
      break; }
    /* País sin subdivisiones en la norma: se añade entero. */
    case 'repAddCountry': {
      keepDraft();
      const d = S.modal.data;
      d.territory = (d.territory || []).concat([{ country:d.country, state:'' }]);
      break; }
    /* ---- segundo campo del lead: las personas de las empresas elegidas ---- */
    case 'leadCtOpen': case 'leadCtPick': case 'leadCtClear': {
      Object.assign(S.modal.data, readModalFields());
      const ui  = S.modal.ctUi = S.modal.ctUi || {};
      const ids = (S.modal.data.salesRepContactIds || []).slice();
      if (act === 'leadCtOpen'){ ui.open = !ui.open; ui.q = ''; if (S.modal.repUi) S.modal.repUi.open = false; }
      if (act === 'leadCtPick'){ const i = ids.indexOf(v); if (i === -1) ids.push(v); else ids.splice(i, 1); }
      if (act === 'leadCtClear'){ ids.length = 0; ui.open = false; }
      S.modal.data.salesRepContactIds = ids;
      renderOverlay();
      if (act === 'leadCtOpen' && ui.open){ const n = document.querySelector('[data-act="leadCtQ"]'); if (n) n.focus(); }
      return; }
    /* ---- desplegable de representantes (Leads: leadRep*, General Information: giRep*) ---- */
    case 'leadRepOpen': case 'giRepOpen': case 'leadRepAll': case 'giRepAll':
    case 'leadRepPick': case 'giRepPick': case 'leadRepClear': case 'giRepClear': {
      const gi = act.indexOf('gi') === 0;
      const q  = gi ? boardQuote(S.openQuote) : null;
      if (gi && (!q || quoteLocked(q))) return;
      if (!gi) Object.assign(S.modal.data, readModalFields());     /* no perder lo tecleado */
      const ui = gi ? (S.giRepMenu = S.giRepMenu || {}) : (S.modal.repUi = S.modal.repUi || {});
      const ids = gi ? quoteReps(q).slice() : (S.modal.data.salesRepIds || []).slice();
      const op  = act.replace(/^(lead|gi)Rep/, '');
      if (op === 'Open'){ ui.open = !ui.open; ui.q = ''; }
      if (op === 'All')  ui.all = !ui.all;
      if (op === 'Pick'){ const i = ids.indexOf(v); if (i === -1) ids.push(v); else ids.splice(i, 1); }
      if (op === 'Clear'){ ids.length = 0; ui.open = false; }
      if (gi){
        q.reps = ids; q.rep = ids[0] || null;
        ids.forEach(id => { if (!q.repContacts[id]){
          const rp = DB.salesReps.find(x => x.id === id);
          q.repContacts[id] = rp && (rp.contacts||[])[0] ? rp.contacts[0].id : ''; } });
        q.repContactId = q.rep ? q.repContacts[q.rep] : '';
        syncRepSurcharge(q);
        render();
      } else {
        const before = S.modal.data.salesRepIds || [];
        S.modal.data.salesRepIds = ids;
        syncLeadContacts(S.modal.data, before);
        if (op === 'Open' && S.modal.ctUi) S.modal.ctUi.open = false;   /* un menú abierto a la vez */
        renderOverlay();
      }
      if (op === 'Open' && ui.open){ const n = document.querySelector('[data-act="'+(gi?'giRepQ':'leadRepQ')+'"]'); if (n) n.focus(); }
      return; }
    case 'saveRep': {
      const f = readModalFields();
      if (!f.name || !f.name.trim()){ S.modal.error = 'Name is required.'; break; }
      if (!(S.modal.data.territory || []).length){ S.modal.error = 'Add at least one territory.'; break; }
      if (Number(f.threshold) <= 0){ S.modal.error = 'Threshold must be greater than zero.'; break; }
      /* `active` no está en el formulario: se gobierna con el toggle de la cabecera
         de la ficha. En alta nace activo; en edición se conserva el valor actual. */
      const payload = {
        name:f.name.trim(), territory:(S.modal.data.territory || []),
        country:f.country, note:f.note||'',
        currencyId:f.currencyId, languageId:f.languageId,
        contacts: S.modal.data.contacts || [], standard: !!S.modal.data.standard, quoteAsClient: !!S.modal.data.quoteAsClient,
        margin:Number(f.margin), accMargin:Number(f.accMargin), commission:Number(f.commission),
        tiers:{ thresholdUsd:Number(f.threshold), belowPct:Number(f.belowPct), abovePct:Number(f.abovePct) }
      };
      const picked = S.modal.data.clientIds || [];
      if (S.modal.kind === 'editRep'){
        Object.assign(DB.salesReps.find(x => x.id === S.modal.id), payload);
        syncRepClients(S.modal.id, picked);
      } else {
        const id = 'rep_' + Math.random().toString(36).slice(2,7);
        DB.salesReps.push(Object.assign({ id:id, authUid:'uid_'+id, active:true }, payload));
        syncRepClients(id, picked);
        S.selRep = id; S.clientsTab = 'reps';
      }
      S.modal = null;
      publishRepFlags();
      break; }

    case 'assignFromRep':    S.modal = { kind:'assign', repId:v, q:'' }; break;
    case 'assignFromClient': {
      const first = DB.salesReps.find(r => r.active);
      S.modal = { kind:'assign', repId:S.clientsTab==='reps' ? S.selRep : (first?first.id:DB.salesReps[0].id), q:'' };
      break; }
    case 'togAssign': {
      const repId = el.getAttribute('data-rep'), cliId = el.getAttribute('data-cli');
      const i = DB.salesRepClients.findIndex(l => l.repId===repId && l.clientId===cliId);
      if (i >= 0) DB.salesRepClients.splice(i,1);
      else DB.salesRepClients.push({ repId:repId, clientId:cliId,
        assignedAt:new Date().toISOString().slice(0,10), assignedBy:'admin@esmetals.com' });
      break; }
    case 'unassign': {
      const repId = el.getAttribute('data-rep'), cliId = el.getAttribute('data-cli');
      const i = DB.salesRepClients.findIndex(l => l.repId===repId && l.clientId===cliId);
      if (i >= 0) DB.salesRepClients.splice(i,1);
      break; }

    case 'newClient':
      S.modal = { kind:'newClient', data:{ name:'', address:'', country:'United States', state:'', cityId:'',
        language:'US', currency:'USD', margin:40, accMargin:15, commission:1, note:'',
        standard:false, directedQuotes:false } };
      break;
    case 'editClient': {
      const c = DB.clients.find(x => x.id === v);
      S.menu = null;
      S.modal = { kind:'editClient', id:c.id, data:clone(c) };
      break; }
    case 'togFlag':
      keepDraft();
      S.modal.data[v] = !S.modal.data[v];
      break;
    case 'saveClient': {
      const f = readModalFields();
      if (!f.name || !f.name.trim()){ S.modal.error = 'Name is required.'; break; }
      if (!f.cityId){ S.modal.error = 'City is required — it decides which sales reps can be offered.'; break; }
      const city = DB.cities.find(x => x.id === f.cityId);
      const payload = {
        name:f.name.trim(), address:(f.address || '').trim(), country:f.country, state:f.state || '',
        cityId:f.cityId, city: city ? city.name : '',
        language:f.language, currency:f.currency,
        margin:Number(f.margin), accMargin:Number(f.accMargin), commission:Number(f.commission),
        note:f.note || '',
        standard:!!S.modal.data.standard, directedQuotes:!!S.modal.data.directedQuotes
      };
      if (S.modal.kind === 'editClient'){
        Object.assign(DB.clients.find(x => x.id === S.modal.id), payload);
      } else {
        const id = 'cli_' + Math.random().toString(36).slice(2,7);
        DB.clients.push(Object.assign({ id:id, active:true, contacts:[] }, payload));
        /* Si vino del lead, se vuelve a él con el cliente nuevo ya elegido. */
        if (S.modal.fromLead && S.modalStack.length){
          const lead = S.modalStack.pop();
          Object.assign(lead.data, { clientId:id, contactId:'',
            country:payload.country, state:payload.state, city:payload.city });
          S.modal = lead;
          autoRep();
          break;
        }
        S.selClient = id; S.clientsTab = 'clients';
      }
      S.modal = S.modalStack.pop() || null;
      break; }

    case 'newLead': S.modal = { kind:'newLead', data:{ name:'', am:'', pm:'', salesRepIds:[], salesRepContactIds:[], contactId:'',
      clientId:'', country:'', state:'', city:'',
      inv:'', due:'', notes:'', docs:'' } }; break;

    /* El "+" de Client abre el alta encima, guardando el lead a medias. */
    case 'newClientFromLead':
      S.modalStack.push(S.modal);
      S.modal = { kind:'newClient', fromLead:true, data:{ name:'', address:'', country:'United States', state:'', cityId:'',
        language:'US', currency:'USD', margin:40, accMargin:15, commission:1, note:'',
        standard:false, directedQuotes:true } };
      break;
    /* El de Client contact reutiliza el modal New Contact ya existente. */
    case 'newContactFromLead':
      S.contactModal = { kind:'client', ownerId:S.modal.data.clientId, fromLead:true,
        data:{ name:'', email:'', cc1:'+1', phone1:'', cc2:'+1', phone2:'',
               country:'United States', state:'', cityId:'', role:'', note:'' } };
      break;
    /* El lead se guarda con todos los representantes elegidos. */
    case 'saveLead': {
      const f = readModalFields();
      const d = Object.assign(S.modal.data, f);
      if (!d.name || !d.name.trim()){ S.modal.error = 'Name is required.'; break; }
      const c = DB.clients.find(x => x.id === d.clientId);
      const fmt = s => s ? s.slice(5,7)+'/'+s.slice(8,10)+'/'+s.slice(0,4) : '';
      DB.leads.unshift({ id:'ld_'+Math.random().toString(36).slice(2,7), name:d.name.trim(),
        clientId:d.clientId || null, clientLabel:c ? c.name : '—', am:d.am || '', pm:d.pm || '', collab:[],
        country:d.country || '', state:d.state || '', city:d.city || '', inv:fmt(d.inv), due:fmt(d.due),
        created:fmt(new Date().toISOString().slice(0,10)), status:'inProgress', pending:0,
        salesRepIds:(d.salesRepIds || []).slice(), salesRepContactIds:(d.salesRepContactIds || []).slice() });
      S.modal = null;
      break; }

    case 'newQuote': {
      const c = S.portalRole === 'client' ? DB.clients.find(x => x.id === S.portalClientId) : null;
      S.modal = { kind:'newQuote', data:{ targetClientId:'', targetContactId:'', product:'', project:'', name:'',
        due:'', amountUsd:'', notes:'', country: c?c.country:'United States', state: c?c.state:'', city: c?c.city:'' } };
      break; }
    case 'saveQuote': {
      const f = readModalFields();
      const isRep = S.portalRole === 'rep';
      if (!f.product || !f.project || !f.name){ S.modal.error = 'Product, Project Name and Quote Name are required.'; break; }
      if (isRep){
        const check = backendValidateQuote(
          { targetClientId:f.targetClientId, targetContactId:f.targetContactId },
          { role:'salesRep', repId:S.portalRepId });
        if (!check.ok){ S.modal.error = check.msg; break; }
        if (!f.targetContactId){ S.modal.error = 'Select the target client contact.'; break; }
        const rep = check.rep;
        const amt = Number(f.amountUsd || 0);
        const cm  = commissionFor(rep, amt);
        DB.quotes.push({
          id:'q_'+Math.random().toString(36).slice(2,7), name:f.name, project:f.project, product:f.product,
          clientId:f.targetClientId, contactId:f.targetContactId, code:newQuoteCode(), status:'Follow up', stage:'bidding', amountUsd:amt,
          createdAt:new Date().toISOString().slice(0,16),
          createdByType:'salesRep', salesRepId:rep.id, salesRepState:(territoryOf(rep)[0]||{}).state||null,
          commissionSnapshot:{ pct:cm.pct, tier:cm.tier, basisUsd:amt, currencyId:rep.currencyId,
                               appliedAt:new Date().toISOString() }
        });
        S.toast = { kind:'ok', msg:'Quote created. Sales rep, city, currency, client, contact and commission snapshot ('+cm.pct+' %) all recorded.' };
      } else {
        const c = DB.clients.find(x => x.id === S.portalClientId);
        DB.quotes.push({
          id:'q_'+Math.random().toString(36).slice(2,7), name:f.name, project:f.project, product:f.product,
          clientId:c.id, contactId:c.contacts[0]?c.contacts[0].id:null, code:newQuoteCode(), status:'Follow up', stage:'bidding',
          amountUsd:Number(f.amountUsd||0), createdAt:new Date().toISOString().slice(0,16),
          createdByType:'client', salesRepId:null, salesRepState:null, commissionSnapshot:null
        });
      }
      S.modal = null;
      break; }

    case 'fOrigin': S.filterOrigin = v; break;

    case 'tryBypass': {
      const rep = DB.salesReps.find(r => r.id === S.portalRepId);
      const victim = DB.clients.find(c => !isAssigned(rep.id, c.id));
      const res = backendValidateQuote({ targetClientId: victim.id, targetContactId: victim.contacts[0].id },
                                       { role:'salesRep', repId:rep.id });
      S.toast = res.ok
        ? { kind:'err', msg:'SECURITY FAILURE: the backend accepted an unassigned client.' }
        : { kind:'err', msg:'<b>Rejected by the backend</b> &mdash; attempt to quote for <b>'+esc(victim.name)+
            '</b>.<br><span class="mono">'+esc(res.msg)+'</span><br><span style="font-size:11.5px">'+
            'This is the same check that must live in the Firestore rules. The frontend does not decide.</span>' };
      break; }

    case 'fClient': return; /* lo maneja change */
  }
  render();
});

/* selects y campos de texto */
document.addEventListener('change', function(ev){
  const el = ev.target;
  const act = el.getAttribute && el.getAttribute('data-act');
  if (act === 'fClient'){ S.filterClient = el.value; render(); return; }

  /* Campos de General Information. Cambiar el representante rehace su
     comisión, así que el efecto se ve al instante en la pestaña Costs. */
  if (act === 'qField'){
    const q = boardQuote(S.openQuote);
    if (!q || quoteLocked(q)) return;
    const key = el.getAttribute('data-v');
    const val = el.value;
    if (key === 'client'){ q.client = val; q.contactId = ''; }
    else if (key === 'contact')    { q.contactId = val; }
    /* Contacto de cada empresa representante; la etiqueta de la comisión no cambia. */
    else if (key.indexOf('repContact:') === 0){
      const id = key.slice(11);
      q.repContacts[id] = val;
      if (id === q.rep) q.repContactId = val;
    }
    else if (key === 'country')    { q.country = val; q.state = ''; }
    else if (key === 'state')      { q.state = val; }
    else if (key === 'city')       { q.city = val; }
    render();
    return;
  }

  const f = el.getAttribute && el.getAttribute('data-f');

  /* Cascadas país -> estado, en el modal de contacto y en el de representante. */
  if (f === 'kCountry' && S.contactModal){
    Object.assign(S.contactModal.data, contactDraft(), { country:el.value, state:'' });
    renderOverlay(); return;
  }
  if (f === 'country' && S.modal &&
      ['newRep','editRep','newClient','editClient'].indexOf(S.modal.kind) !== -1){
    keepDraft();
    S.modal.data.country = el.value; S.modal.data.state = '';
    renderOverlay(); return;
  }

  /* cascada cliente -> contacto en el modal de cotización */
  if (f === 'targetClientId' && S.modal && S.modal.kind === 'newQuote'){
    S.modal.data = Object.assign(S.modal.data, readModalFields(), { targetContactId:'' });
    S.modal.error = null;
    renderOverlay();
    return;
  }
  /* Elegir en "Add client" añade el chip en el acto. keepDraft() rescata antes
     lo ya tecleado, porque el modal se repinta entero. */
  if (f === 'addClient' && S.modal && (S.modal.kind === 'newRep' || S.modal.kind === 'editRep')){
    const pick = el.value;
    keepDraft();
    if (pick) S.modal.data.clientIds = (S.modal.data.clientIds || []).concat([pick]);
    renderOverlay();
    return;
  }
  if (f === 'addState' && S.modal && (S.modal.kind === 'newRep' || S.modal.kind === 'editRep' || S.modal.kind === 'repStates')){
    const pick = el.value;
    keepDraft();
    const d = S.modal.data;
    if (pick) d.territory = (d.territory || []).concat([{ country:d.country, state:pick }]);
    renderOverlay();
    return;
  }
  /* Cambiar de país solo cambia la lista que se ofrece: lo ya añadido se conserva. */
  if (f === 'country' && S.modal && (S.modal.kind === 'newRep' || S.modal.kind === 'editRep' || S.modal.kind === 'repStates')){
    keepDraft();
    renderOverlay();
    return;
  }
  /* Elegir cliente arrastra su ubicación e invalida contacto y representante:
     la ciudad del nuevo cliente puede no tener a ninguno de los dos.
     País y ciudad quedan editables — el proyecto puede estar en otro sitio. */
  /* Elegir cliente arrastra su ubicación y, con ella, el representante. */
  if (f === 'clientId' && S.modal && S.modal.kind === 'newLead'){
    const picked = DB.clients.find(x => x.id === el.value);
    Object.assign(S.modal.data, readModalFields(), {
      contactId : '',


      country   : picked ? picked.country : '',
      state     : picked ? picked.state   : '',
      city      : picked ? picked.city    : ''
    });
    autoRep();
    renderOverlay();
    return;
  }
  /* Cambiar país o estado recalcula el representante por defecto. */
  if ((f === 'country' || f === 'state') && S.modal && S.modal.kind === 'newLead'){
    Object.assign(S.modal.data, readModalFields());
    if (f === 'country') S.modal.data.state = '';
    autoRep();
    renderOverlay();
    return;
  }
  if (f && S.modal){ S.modal.data = Object.assign(S.modal.data, readModalFields()); }
});

document.addEventListener('input', function(ev){
  const el = ev.target;
  const act = el.getAttribute && el.getAttribute('data-act');
  if (act === 'query'){ S.masterQuery = el.value; const p = el.selectionStart; render();
    const n = document.querySelector('[data-act="query"]'); if (n){ n.focus(); n.setSelectionRange(p,p); } return; }
  if (act === 'assignQuery' && S.modal){ S.modal.q = el.value; const p = el.selectionStart; renderOverlay();
    const n = document.querySelector('[data-act="assignQuery"]'); if (n){ n.focus(); n.setSelectionRange(p,p); } return; }
  if (act === 'cSearch'){ S.cSearch = el.value; const p = el.selectionStart; render();
    const n = document.querySelector('[data-act="cSearch"]'); if (n){ n.focus(); n.setSelectionRange(p,p); } return; }
  if (act === 'leadCtQ' && S.modal && S.modal.ctUi){
    S.modal.ctUi.q = el.value; const p = el.selectionStart; renderOverlay();
    const n = document.querySelector('[data-act="leadCtQ"]'); if (n){ n.focus(); n.setSelectionRange(p,p); }
    return; }
  if (act === 'leadRepQ' || act === 'giRepQ'){
    const gi = act === 'giRepQ';
    const ui = gi ? S.giRepMenu : (S.modal && S.modal.repUi);
    if (!ui) return;
    ui.q = el.value; const p = el.selectionStart;
    if (gi) render(); else renderOverlay();
    const n = document.querySelector('[data-act="'+act+'"]'); if (n){ n.focus(); n.setSelectionRange(p,p); }
    return; }
  if (act === 'mbQuery'){ const k = el.getAttribute('data-k');
    S.mbQuery[k] = el.value; const p = el.selectionStart; render();
    const n = document.querySelector('[data-act="mbQuery"][data-k="'+k+'"]');
    if (n){ n.focus(); n.setSelectionRange(p,p); } return; }
  if (act === 'mbSearch'){ const col = el.getAttribute('data-v');
    S.mbSearch[col] = el.value; const p = el.selectionStart; render();
    const n = document.querySelector('[data-act="mbSearch"][data-v="'+col+'"]');
    if (n){ n.focus(); n.setSelectionRange(p,p); } return; }
  const f = el.getAttribute && el.getAttribute('data-f');
  if (f && S.modal){
    S.modal.data[f] = el.value;
    /* El preview de comisión depende del monto: hay que repintarlo al teclear. */
    if (f === 'amountUsd' && S.modal.kind === 'newQuote' && S.portalRole === 'rep' && S.modal.data.targetClientId){
      const p = el.selectionStart;
      renderOverlay();
      const n = document.querySelector('[data-f="amountUsd"]');
      if (n){ n.focus(); try { n.setSelectionRange(p, p); } catch(e){} }
    }
  }
});

document.addEventListener('focusin',  e => { const f = e.target.closest('.field'); if (f) f.classList.add('focus'); });
document.addEventListener('focusout', e => { const f = e.target.closest('.field'); if (f) f.classList.remove('focus'); });
document.addEventListener('keydown',  e => {
  if (e.key !== 'Escape') return;
  /* Los apilados se cierran primero: están por encima. */
  if (S.contactModal){ S.contactModal = null; render(); }
  else if (S.modal){ S.modal = null; render(); }
  else if (S.menu){ S.menu = null; render(); }
});

publishRepFlags();
render();
</script>
