<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Representatives — Prototype</title>
<style>
/* ============================================================
   Project Agenda — tokens reconstruidos de las capturas
   ============================================================ */
:root{
  --primary:#1867C0;
  --primary-dark:#12539B;
  --primary-tint:#E3F2FD;
  --link:#1976D2;
  --orange:#FF9800;
  --amber:#FFC107;
  --green:#2E7D32;
  --red:#C62828;
  --text:#212121;
  --text2:#757575;
  --text3:#9E9E9E;
  --border:#E0E0E0;
  --border-strong:#BDBDBD;
  --surface:#FFFFFF;
  --rail:#FAFAFA;
  --field:#F0F0F0;
  --thead:#EEEEEE;
  --hover:#F5F5F5;
  --shadow-1:0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08);
  --shadow-3:0 3px 6px rgba(0,0,0,.16), 0 3px 6px rgba(0,0,0,.10);
  --shadow-8:0 8px 24px rgba(0,0,0,.20), 0 4px 8px rgba(0,0,0,.12);
  --proto:#263238;
  --font:Roboto,"Helvetica Neue",Helvetica,Arial,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);font-size:14px;color:var(--text);
  background:#ECEFF1;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit}

/* ---------- barra de prototipo (NO es parte del producto) ---------- */
.proto{
  background:var(--proto);color:#ECEFF1;display:flex;align-items:center;gap:8px;
  padding:0 12px;height:44px;flex-wrap:wrap;
}
.proto .brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#90A4AE;margin-right:4px;white-space:nowrap}
.proto .sep{width:1px;height:20px;background:#455A64;margin:0 4px}
.pbtn{
  background:transparent;border:1px solid #546E7A;color:#CFD8DC;border-radius:4px;
  padding:5px 10px;font-size:12px;cursor:pointer;white-space:nowrap;
}
.pbtn:hover{background:#37474F;color:#fff}
.pbtn.on{background:#1867C0;border-color:#1867C0;color:#fff}
.pseg{display:inline-flex;border:1px solid #546E7A;border-radius:4px;overflow:hidden}
.pseg .pbtn{border:0;border-radius:0}
.pseg .pbtn + .pbtn{border-left:1px solid #546E7A}
.proto .spacer{flex:1}
.proto .who{font-size:12px;color:#B0BEC5}
.proto .who b{color:#fff;font-weight:500}

/* ---------- shell de la aplicación ---------- */
.frame{height:calc(100vh - 44px);display:flex;flex-direction:column;background:var(--surface)}
.appbar{
  height:52px;display:flex;align-items:center;gap:16px;padding:0 16px;
  background:var(--surface);border-bottom:1px solid var(--border);flex:none;
}
.appbar .spacer{flex:1}
.searchbar{
  display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:22px;height:34px;padding:0 14px;width:290px;color:var(--text2);box-shadow:var(--shadow-1);
}
.searchbar input{border:0;outline:0;flex:1;font-size:13px;background:transparent;color:var(--text)}
.bell{position:relative;color:#616161}
.badge{
  position:absolute;top:-6px;right:-10px;background:#E53935;color:#fff;border-radius:10px;
  font-size:10px;line-height:1;padding:3px 5px;font-weight:500;
}
.avatar-ic{color:#616161}

.body{flex:1;display:flex;min-height:0}

/* ---------- rail lateral de iconos ---------- */
.rail{
  width:56px;flex:none;background:var(--rail);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;padding-top:6px;
}
.rail .caption{font-size:8px;letter-spacing:.1em;color:#B0BEC5;text-transform:uppercase;margin-bottom:8px}
.rail-btn{
  width:40px;height:40px;border:0;background:transparent;border-radius:8px;cursor:pointer;
  display:grid;place-items:center;color:#616161;position:relative;margin-bottom:4px;
}
.rail-btn:hover{background:#ECEFF1}
.rail-btn.on{color:var(--primary);background:var(--primary-tint)}
.rail .grow{flex:1}
.rail-btn .dot{
  position:absolute;top:2px;right:2px;background:#E53935;color:#fff;border-radius:10px;
  font-size:9px;padding:1px 4px;line-height:1.3;
}

.content{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- panel maestro (lista) ---------- */
.master{
  width:300px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;
  background:var(--surface);
}
.master-search{padding:10px 12px}
.pill-search{
  display:flex;align-items:center;gap:8px;background:var(--field);border-radius:20px;
  height:34px;padding:0 14px;color:var(--text2);
}
.pill-search input{border:0;outline:0;background:transparent;flex:1;font-size:13px;min-width:0}
.master-tools{display:flex;align-items:center;gap:8px;padding:2px 12px 10px}
.sortbtn{
  background:transparent;border:0;display:flex;align-items:center;gap:6px;color:var(--text);
  font-size:14px;cursor:pointer;padding:4px;
}
.master-tools .spacer{flex:1}
.master-list{flex:1;overflow:auto}
.mitem{
  display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;border:0;background:transparent;
  width:100%;text-align:left;font-family:inherit;
}
.mitem:hover{background:var(--hover)}
.mitem.on{background:var(--primary-tint)}
.mitem .thumb{
  width:30px;height:30px;border-radius:50%;background:#EEEEEE;color:#78909C;
  display:grid;place-items:center;flex:none;
}
.mitem .nm{font-size:13px;color:var(--link);line-height:1.3}
.mitem .sub{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text2);margin-top:3px}
.mitem.off .nm{color:var(--text3)}
.chip-off{
  font-size:9px;letter-spacing:.06em;text-transform:uppercase;background:#EEEEEE;color:#757575;
  border-radius:9px;padding:2px 7px;margin-left:6px;vertical-align:1px;
}

/* segmentado CLIENTS / SALES REPS */
.segbar{display:flex;border-bottom:1px solid var(--border);background:var(--surface)}
.segbar button{
  flex:1;background:transparent;border:0;border-bottom:2px solid transparent;cursor:pointer;
  padding:11px 6px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);font-weight:500;
}
.segbar button.on{color:var(--primary);border-bottom-color:var(--primary)}

/* ---------- panel de detalle ---------- */
.detail{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface)}
.tabs{display:flex;background:#F7F7F7;border-bottom:1px solid var(--border);padding:0 4px}
.tabs button{
  background:transparent;border:0;border-bottom:2px solid transparent;cursor:pointer;
  padding:13px 18px;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);font-weight:500;
}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.detail-body{flex:1;overflow:auto;padding:18px 26px 40px}
.dtitle{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.dtitle .ic{width:30px;height:30px;color:#607D8B;flex:none}
.dtitle h2{font-size:20px;font-weight:400;margin:0;flex:1}
.empty{flex:1;display:grid;place-items:center;color:var(--text2);font-size:14px}

/* filas etiqueta/valor */
.rows{display:grid;grid-template-columns:210px 1fr;row-gap:13px;column-gap:16px;align-items:center;max-width:900px}
.rows .lbl{color:var(--text2);font-size:13.5px}
.rows .val{font-size:13.5px}
.hr{border:0;border-top:1px solid var(--border);margin:22px 0}

/* ---------- controles ---------- */
.btn{
  border:0;border-radius:22px;padding:9px 20px;font-size:12.5px;font-weight:500;letter-spacing:.06em;
  text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
}
.btn-primary{background:var(--primary);color:#fff;box-shadow:var(--shadow-1)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-flat{background:transparent;color:var(--primary)}
.btn-flat:hover{background:var(--primary-tint)}
.btn-quiet{background:transparent;color:var(--text3)}
.btn-quiet:enabled{color:var(--primary)}
.btn-outline{background:transparent;color:var(--text2);border:1px solid var(--border-strong)}
.btn-outline:hover{background:var(--hover)}
.btn:disabled{color:var(--text3);cursor:not-allowed;background:transparent;box-shadow:none}
.icon-btn{
  width:34px;height:34px;border-radius:50%;border:0;background:transparent;cursor:pointer;
  display:grid;place-items:center;color:#616161;
}
.icon-btn:hover{background:var(--hover)}
.icon-btn.add{color:var(--primary)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.icon-btn:disabled:hover{background:transparent}

/* menú del botón de tres puntos */
.menu-wrap{position:relative}
.menu{
  position:absolute;top:38px;right:0;background:#fff;border-radius:4px;box-shadow:var(--shadow-8);
  min-width:196px;padding:6px 0;z-index:50;
}
.menu button{
  display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;cursor:pointer;
  padding:10px 16px;font-size:13.5px;font-family:inherit;color:var(--text);text-align:left;
}
.menu button:hover{background:var(--hover)}
.menu .ic{color:#607D8B;display:grid;place-items:center}
.menu-search{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);
  color:var(--text2)}
.menu-search input{border:0;outline:0;flex:1;font-size:13px;font-family:inherit;background:transparent;
  min-width:0}
.menu-list{max-height:272px;overflow-y:auto;padding:4px 0}
.menu-list .cbx{width:16px;height:16px;border-width:2px}
.menu-empty{padding:14px 16px;font-size:12.5px;color:var(--text3)}
/* Desplegable de representantes (Leads y General Information): el disparador se ve como un select. */
.csel{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;cursor:pointer;
  padding:2px 0 0;min-height:22px;font:inherit;font-size:14px;color:var(--text);text-align:left}
.csel > span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csel svg{color:#757575;flex:none}
.csel:disabled{cursor:default;color:var(--text3)}
.gi-csel{border-bottom:1px solid var(--border-strong);font-size:13.5px;padding:3px 0}
.rp-wrap{position:relative;min-width:0}
/* Las celdas de los formularios pueden encoger: un texto largo se corta con «…» en su campo
   en vez de ensanchar la columna y sacar el formulario de su ancho. */
.fgrid > *{min-width:0}
.rp-menu{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:30;box-shadow:var(--shadow-8)}
.rp-menu .rp-sep{padding:6px 14px 2px;font-size:10.5px;letter-spacing:.06em;color:var(--text2);border-top:1px solid var(--border)}
.rp-menu .menu-list button{padding:7px 14px;font-size:13px;gap:10px}
.rp-menu .menu-list button span:last-child{font-size:11.5px}
.rp-menu .menu-search{padding:6px 14px}
.rp-menu .menu-foot button{padding:8px 14px;font-size:12.5px}
.menu-foot{border-top:1px solid var(--border);padding:4px 0}
.menu-foot button{color:var(--primary);font-size:12.5px}

.toggle{
  width:42px;height:22px;border-radius:11px;background:#BDBDBD;position:relative;cursor:pointer;
  border:0;padding:0;transition:background .15s;flex:none;
}
.toggle .knob{
  position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:var(--shadow-1);transition:left .15s;
}
.toggle.on{background:#67A4E1}
.toggle.on .knob{left:22px;background:var(--primary)}

.cbx{
  width:18px;height:18px;border:2px solid var(--text3);border-radius:2px;background:#fff;cursor:pointer;
  display:grid;place-items:center;padding:0;flex:none;
}
.cbx.on{background:var(--primary);border-color:var(--primary);color:#fff}
.cbx:disabled{opacity:.5;cursor:not-allowed}

/* campos Material de línea inferior */
.field{display:flex;align-items:flex-end;gap:11px;border-bottom:1px solid var(--border-strong);padding-bottom:5px}
.field.focus{border-bottom:2px solid var(--primary);padding-bottom:4px}
.field .fic{color:#78909C;flex:none;margin-bottom:2px}
.field .fbox{flex:1;min-width:0}
.field .flab{display:block;font-size:10.5px;color:var(--text2);letter-spacing:.02em}
.field input,.field select,.field textarea{
  border:0;outline:0;width:100%;font-size:13.5px;font-family:inherit;color:var(--text);
  background:transparent;padding:2px 0 0;
}
.field select{cursor:pointer;-webkit-appearance:none;appearance:none}
.field.disabled{border-bottom-style:dashed;background:#FAFAFA}
.field.disabled input,.field.disabled select{color:var(--text3);cursor:not-allowed}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:26px 24px}
.fgrid .span2{grid-column:1 / -1}
/* Dos rejillas contiguas se pegaban: el gap solo actúa dentro de cada una. */
.fgrid + .fgrid{margin-top:26px}
.req{color:var(--text2);font-size:11.5px;margin-top:20px}

/* ---------- tablas ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl thead th{
  background:var(--thead);text-align:left;font-weight:500;color:#424242;font-size:12px;
  padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;
}
table.tbl tbody td{padding:11px 12px;border-bottom:1px solid #EEEEEE;vertical-align:middle}
table.tbl tbody tr:hover{background:#FAFAFA}
table.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-empty{padding:26px 12px;color:var(--text2);font-size:13px;text-align:center}

/* ---------- chips ---------- */
.chip{
  display:inline-flex;align-items:center;gap:6px;background:#EEEEEE;border-radius:14px;
  padding:5px 11px;font-size:12.5px;color:#424242;
}
.chip.blue{background:var(--primary-tint);color:#0D47A1}
.chip .x{border:0;background:transparent;cursor:pointer;color:#78909C;padding:0;display:grid;place-items:center}
.chip .x:hover{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.avatar{
  width:30px;height:30px;border-radius:50%;background:#ECEFF1;color:#455A64;display:grid;place-items:center;
  font-size:11px;font-weight:600;flex:none;letter-spacing:.02em;
}
/* lista de contactos: vertical y con scroll */
.ctlist{max-width:430px;max-height:252px;overflow-y:auto;padding-right:4px}
.ctrow{display:flex;align-items:center;gap:13px;padding:6px 2px}
.ctrow .avatar{width:34px;height:34px;font-size:12px}
.ctrow .t{flex:1;min-width:0;line-height:1.3}
.ctrow .t b{display:block;font-weight:500;font-size:13.5px}
.ctrow .t span{display:block;font-size:12px;color:var(--text2)}
.ctrow .x{border:0;background:transparent;cursor:pointer;color:var(--text3);display:grid;place-items:center;
  width:26px;height:26px;border-radius:50%;flex:none;opacity:0;transition:opacity .12s}
.ctrow:hover .x{opacity:1}
.ctrow .x:hover{color:var(--red);background:var(--hover)}
/* representantes asignados a un cliente — misma fila que un contacto */
.replist{display:flex;flex-direction:column;gap:2px;max-width:430px}
.reprow{display:flex;align-items:center;gap:13px;padding:5px 2px}
.reprow .avatar{width:32px;height:32px;font-size:11.5px}
.reprow .t{flex:1;min-width:0;line-height:1.3}
.reprow .t b{display:block;font-weight:500;font-size:13.5px}
.reprow .t span{display:block;font-size:12px;color:var(--text2)}
.reprow .x{border:0;background:transparent;cursor:pointer;color:var(--text3);display:grid;place-items:center;
  width:26px;height:26px;border-radius:50%;flex:none;opacity:0;transition:opacity .12s}
.reprow:hover .x{opacity:1}
.reprow .x:hover{color:var(--red);background:var(--hover)}

/* ---------- Main Board ---------- */
.mb{padding:14px 18px 20px;display:flex;flex-direction:column;height:100%;min-height:0}
.mb-head{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex:none}
.mb-head h1{font-size:20px;font-weight:400;margin:0;flex:1}
.mb-filter{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;cursor:pointer;
  font-family:inherit;font-size:13.5px;color:var(--text2);padding:7px 10px;border-radius:4px;white-space:nowrap}
.mb-filter:hover{background:var(--hover)}
.mb-filter.on{background:var(--primary-tint);color:var(--primary);font-weight:500}
.mb-filter .x{display:grid;place-items:center;color:inherit;opacity:.7}
.mb-filter .x:hover{opacity:1}
.mb-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1;min-height:0}
.mb-col{display:flex;flex-direction:column;min-height:0}
.mb-chead{border-radius:8px 8px 0 0;padding:9px 12px 12px;color:#fff;flex:none}
.mb-col.blue   .mb-chead{background:var(--primary)}
.mb-col.orange .mb-chead{background:var(--orange)}
.mb-col.amber  .mb-chead{background:var(--amber)}
.mb-chead .t{display:flex;align-items:center;gap:10px}
.mb-chead .t b{font-size:14px;font-weight:700;flex:1}
.mb-chead .sum{font-size:13px;font-weight:700;margin:2px 0 9px}
.mb-search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;height:30px;
  padding:0 12px;color:var(--text2)}
.mb-search input{border:0;outline:0;flex:1;font-size:12.5px;background:transparent;min-width:0}
.mb-body{flex:1;min-height:0;overflow-y:auto;background:#fff;border:1px solid var(--border);border-top:0;
  border-radius:0 0 8px 8px;padding:10px;display:flex;flex-direction:column;gap:10px}
.mb-card{border:1px solid var(--border);border-radius:6px;padding:10px 12px;background:#fff}
.mb-card .top{display:flex;align-items:flex-start;gap:8px}
.mb-card .cli{flex:1;font-size:13.5px;font-weight:500;line-height:1.3}
.mb-col.blue   .mb-card .cli{color:var(--primary)}
.mb-col.orange .mb-card .cli{color:var(--orange-dark)}
.mb-col.amber  .mb-card .cli{color:#C79100}
.mb-card .ico{display:flex;gap:6px;color:var(--text3);flex:none}
.mb-card .prj{font-size:12.5px;margin-top:4px;line-height:1.4}
.mb-card .dt{font-size:11.5px;color:var(--text3);margin-top:5px}
.mb-card .amt{font-size:13.5px;font-weight:500;text-align:right;margin-top:4px;font-variant-numeric:tabular-nums}
.mb-empty{color:var(--text3);font-size:12.5px;text-align:center;padding:26px 8px}

/* ---------- Follow Up ---------- */
.fu{display:flex;flex-direction:column;min-height:420px}
.fu-thread{flex:1;min-height:260px;padding:4px 0 18px}
.fu-msg{background:#F5F5F5;border-radius:4px;padding:12px 14px;max-width:620px;margin-bottom:12px}
.fu-msg .h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.fu-msg .h .who{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px;flex:1}
.fu-msg .h .when{font-size:11.5px;color:var(--text2)}
.fu-msg .b{font-size:13px;line-height:1.5}
.fu-det{margin-top:9px;padding-top:9px;border-top:1px solid #E0E0E0;font-size:12px;color:var(--text2);
  line-height:1.7}
.fu-empty{color:var(--text3);font-size:13px;padding:24px 2px}
.fu-input{border:1px solid var(--border);border-radius:4px;min-height:86px;padding:12px 14px;
  font-size:13px;color:var(--text3);font-style:italic}
.fu-foot{display:flex;align-items:flex-end;gap:30px;margin-top:16px;flex-wrap:wrap}
.fu-foot .m .l{font-size:12px;font-weight:500}
.fu-foot .m .v{font-size:12.5px;color:var(--text2);margin-top:3px}
.fu-foot .spacer{flex:1}
.fu-foot .icons{display:flex;align-items:center;gap:14px;color:var(--primary)}
.btn-send{background:#E0E0E0;color:#9E9E9E;border:0;border-radius:18px;padding:8px 22px;font-size:12.5px;
  font-weight:500;letter-spacing:.06em;text-transform:uppercase;cursor:not-allowed}

/* ---------- General Information de la cotización ---------- */
.gi{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px 56px;align-items:start}
.gi-col{display:grid;grid-template-columns:120px minmax(0,1fr);row-gap:18px;column-gap:14px;align-items:center;
  font-size:13px}
.gi-col .gl{color:var(--text2);line-height:1.35}
.gi-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.gi-head h3{margin:0;font-size:13.5px;font-weight:500}
.gi-head .spacer{flex:1}
.gi-div{border:0;border-top:1px solid var(--border);margin:22px 0 16px}
.gi-card{margin:10px 0 0 134px}
.gi-person{display:flex;align-items:center;gap:10px}
.gi-person .t b{display:block;font-weight:500;font-size:13px;line-height:1.25}
.gi-person .t span{display:block;font-size:11.5px;color:var(--text2)}
.gi-sel{width:100%;border:0;border-bottom:1px solid var(--border-strong);outline:0;background:transparent;
  font-family:inherit;font-size:13.5px;color:var(--text);padding:3px 0;cursor:pointer}
.gi-sel:focus{border-bottom:2px solid var(--primary);padding-bottom:2px}
.gi-sel:disabled{color:var(--text2);cursor:not-allowed;border-bottom-style:dashed}
.gi-ro{font-size:13.5px}
.gi-chip{display:inline-flex;align-items:center;gap:6px;background:#EEEEEE;border-radius:3px;padding:3px 8px;
  font-size:11px;color:#455A64;margin:0 6px 6px 0}
.gi-plus{width:26px;height:26px;border-radius:50%;border:0;background:var(--primary);color:#fff;cursor:pointer;
  display:grid;place-items:center;flex:none}
.gi-plus:disabled{background:var(--border-strong);cursor:not-allowed}
.gi-dates{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:26px;font-size:13px}
.gi-dates .dl{font-size:12px;font-weight:500;margin-bottom:5px}
.gi-dates .dv{color:var(--text2)}
.qstat{border-radius:14px;padding:5px 16px;font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:#fff}
.btn-save{background:#43A047;color:#fff;border:0;border-radius:18px;padding:8px 22px;font-size:12.5px;
  font-weight:500;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn-save:disabled{background:#BDBDBD;cursor:not-allowed}
.lockbadge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text2)}

/* ---------- vista de cotización: General Information / Costs ---------- */
.qv{padding:0;display:flex;flex-direction:column;height:100%;min-height:0}
.qv-bar{display:flex;align-items:center;gap:10px;padding:12px 18px 0;font-size:14px;color:var(--text2)}
.qv-bar button{border:0;background:transparent;cursor:pointer;color:inherit;display:flex;align-items:center;
  gap:9px;font-family:inherit;font-size:14px;padding:4px 6px;border-radius:4px}
.qv-bar button:hover{background:var(--hover)}
.qv-body{flex:1;min-height:0;overflow:auto;padding:18px 24px 40px}
.qv-title{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.qv-title h2{margin:0;font-size:17px;font-weight:500}
.qv-sect{font-size:12px;font-weight:500;color:var(--text2);margin:0 0 14px}
.gterms{display:grid;grid-template-columns:150px 1fr;row-gap:16px;align-items:start;font-size:13px;
  max-width:900px}
.gterms .gl{color:var(--text2)}
.qv-links{display:flex;gap:22px;justify-content:flex-end;margin-bottom:-24px}
.qv-links a{color:var(--primary);font-size:12px;letter-spacing:.05em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-weight:500}

/* recargos: bloques compactos con el porcentaje editable */
.surs{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.sur{position:relative;min-width:96px;padding-right:4px}
.sur .sl{font-size:11.5px;color:var(--primary);line-height:1.3;padding-right:14px}
/* El número y el % son un solo bloque: sin separación y sin subrayado. */
.sur .sv{display:flex;align-items:baseline;gap:0;margin-top:3px}
.sur .sv span{font-size:13.5px;color:var(--text)}
.sur .sv .ed{border:0;background:transparent;cursor:pointer;color:var(--text);padding:0;margin-left:6px;
  display:inline-grid;place-items:center;align-self:center}
.sur-add{width:30px;height:30px;border-radius:50%;border:0;background:var(--primary);color:#fff;
  cursor:pointer;display:grid;place-items:center;margin-top:6px;flex:none}
.sur-add:hover{background:var(--primary-dark)}

.vmode{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text2)}
.itemhead{display:flex;align-items:center;gap:10px;margin:30px 0 12px}
.itemhead .t{font-size:13px;letter-spacing:.06em;color:var(--text2);flex:1}
table.ctbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.ctbl th{background:#fff;color:var(--text2);font-weight:400;font-size:11px;letter-spacing:.05em;
  text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
table.ctbl td{padding:10px;border-bottom:1px solid #F0F0F0;white-space:nowrap}
table.ctbl tbody tr:hover{background:#FAFAFA}
table.ctbl .num{text-align:right;font-variant-numeric:tabular-nums}
table.ctbl tr.tot td{background:#EEEEEE;font-weight:500;border-bottom:0}
table.ctbl .act{display:flex;gap:10px;color:var(--text3)}
table.ctbl .act button{border:0;background:transparent;cursor:pointer;color:inherit;padding:0}
table.ctbl .act button:hover{color:var(--primary)}

/* tabla de cotizaciones */
.qlink{color:var(--primary);font-size:13px;cursor:pointer}
.qlink:hover{text-decoration:underline}
.qstatus{display:inline-block;min-width:104px;text-align:center;border-radius:14px;padding:5px 14px;
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;white-space:nowrap}
.qstatus.follow  {background:#FFC107;color:#fff}
.qstatus.approval{background:#FF9800}
.qstatus.awarded {background:#43A047}
.qstatus.lost    {background:#EF5350}

/* tramos de comisión */
.tiers{display:grid;grid-template-columns:auto auto;gap:5px 18px;justify-content:start;align-items:baseline}
.tiers span{color:var(--text2);font-variant-numeric:tabular-nums}
.tiers b{font-weight:500;font-variant-numeric:tabular-nums}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px}
.status-dot.on{background:#43A047}
.status-dot.off{background:#BDBDBD}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:60;padding:24px;
}
.modal{
  background:#fff;border-radius:4px;box-shadow:var(--shadow-8);width:100%;max-width:560px;
  max-height:90vh;display:flex;flex-direction:column;
}
.modal.wide{max-width:760px}
.modal-head{display:flex;align-items:center;gap:14px;padding:18px 24px 6px}
.modal-head h3{margin:0;font-size:19px;font-weight:500;flex:1}
.modal-hero{display:grid;place-items:center;padding:4px 0 14px}
.modal-hero .circle{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center}
.modal-body{padding:6px 24px 12px;overflow:auto;flex:1}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 18px 16px}

/* ---------- kanban del portal ---------- */
.board{padding:16px 20px 40px;overflow:auto;flex:1}
.board h1{font-size:15px;font-weight:400;margin:0 0 14px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.col{border-radius:8px;overflow:hidden;box-shadow:var(--shadow-1);background:#fff}
.col-head{padding:9px 12px 12px;color:#fff}
.col-head .t{display:flex;align-items:center;gap:10px}
.col-head .t h4{margin:0;font-size:14px;font-weight:500;flex:1}
.col-head .cnt{font-size:12px;opacity:.92;margin:2px 0 8px}
.col.blue .col-head{background:var(--primary)}
.col.orange .col-head{background:var(--orange)}
.col.amber .col-head{background:var(--amber)}
.col.amber .col-head{color:#3E2723}
.col-search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;height:28px;padding:0 11px;color:var(--text2)}
.col-search input{border:0;outline:0;flex:1;font-size:12px;background:transparent;min-width:0}
.btn-oncolor{
  background:transparent;border:1px solid rgba(255,255,255,.75);color:#fff;border-radius:4px;
  padding:4px 10px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;
}
.btn-oncolor:hover{background:rgba(255,255,255,.16)}
.mini-chip{
  border:1px solid rgba(255,255,255,.8);border-radius:11px;padding:2px 9px;font-size:10.5px;color:#fff;
  background:transparent;cursor:pointer;
}
.mini-chip.on{background:#fff;color:var(--orange)}
.col-body{padding:10px;display:flex;flex-direction:column;gap:10px;min-height:80px}
.qcard{border:1px solid var(--border);border-radius:6px;padding:11px 12px;background:#fff}
.qcard .top{display:flex;align-items:flex-start;gap:8px}
.qcard .qn{font-size:13px;font-weight:500;flex:1;line-height:1.35}
.qcard .pn{font-size:12px;color:var(--text2);margin-top:3px}
.qcard .dt{font-size:11px;color:var(--text3);margin-top:6px}
.qcard .directed{
  margin-top:9px;padding-top:8px;border-top:1px dashed var(--border);
  font-size:11.5px;color:#0D47A1;display:flex;align-items:center;gap:6px;
}
.col-empty{color:var(--text3);font-size:12.5px;text-align:center;padding:16px 8px}

/* barra de filtros del representante */
.repbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--primary-tint);
  border:1px solid #BBDEFB;border-radius:8px;padding:10px 14px;margin-bottom:16px;
}
.repbar .who{display:flex;align-items:center;gap:9px;font-size:13px;color:#0D47A1}
.repbar .who b{font-weight:500}
.repbar .spacer{flex:1}
.repbar select{
  border:1px solid #90CAF9;border-radius:4px;background:#fff;font-size:12.5px;padding:5px 9px;
  font-family:inherit;color:var(--text);cursor:pointer;
}
.repbar label{font-size:11px;color:#0D47A1;display:block;margin-bottom:3px;letter-spacing:.02em}
.seg{display:inline-flex;border:1px solid #90CAF9;border-radius:4px;overflow:hidden;background:#fff}
.seg button{
  border:0;background:transparent;padding:6px 12px;font-size:11.5px;cursor:pointer;color:#1565C0;
  letter-spacing:.04em;text-transform:uppercase;
}
.seg button + button{border-left:1px solid #90CAF9}
.seg button.on{background:var(--primary);color:#fff}

/* ---------- avisos ---------- */
.alert{
  display:flex;gap:11px;align-items:flex-start;border-radius:4px;padding:11px 14px;font-size:12.5px;
  line-height:1.5;margin:14px 0;
}
.alert .ai{flex:none;margin-top:1px}
.alert.info{background:#E3F2FD;color:#0D47A1;border-left:4px solid var(--primary)}
.alert.warn{background:#FFF8E1;color:#6D4C00;border-left:4px solid var(--amber)}
.alert.err{background:#FFEBEE;color:#B71C1C;border-left:4px solid #E53935}
.alert.ok{background:#E8F5E9;color:#1B5E20;border-left:4px solid #43A047}
.alert b{font-weight:500}

/* panel de notas de spec */
.notes{
  position:fixed;right:0;top:44px;bottom:0;width:410px;background:#fff;box-shadow:var(--shadow-8);
  z-index:70;display:flex;flex-direction:column;
}
.notes header{
  display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);
  background:var(--proto);color:#fff;
}
.notes header h3{margin:0;font-size:14px;font-weight:500;flex:1;letter-spacing:.03em}
.notes header .icon-btn{color:#B0BEC5}
.notes header .icon-btn:hover{background:#37474F}
.notes .nbody{overflow:auto;padding:16px 18px 40px;font-size:13px;line-height:1.6}
.notes h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin:20px 0 8px}
.notes h4:first-child{margin-top:0}
.notes ul{margin:0 0 10px;padding-left:18px}
.notes li{margin-bottom:6px}
.notes code{background:#F5F5F5;border-radius:3px;padding:1px 5px;font-size:12px;font-family:Consolas,Monaco,monospace}
.notes .pill{
  display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;border-radius:10px;
  padding:2px 8px;background:#EEEEEE;color:#616161;margin-right:6px;
}
.notes .pill.new{background:#E8F5E9;color:#1B5E20}
.notes .pill.chg{background:#FFF8E1;color:#6D4C00}

/* simulador de comisión */
.sim{border:1px solid var(--border);border-radius:6px;padding:14px 16px;max-width:560px;background:#FAFAFA}
.sim .simrow{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.sim .out{font-size:13px;line-height:1.7}
.sim .out .big{font-size:19px;font-weight:500;color:var(--primary)}
.mono{font-family:Consolas,Monaco,monospace;font-size:12.5px}

.footer{
  display:flex;justify-content:space-between;padding:8px 16px;border-top:1px solid var(--border);
  font-size:11.5px;color:var(--text2);background:var(--surface);flex:none;
}
.sect-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin:26px 0 12px;font-weight:500}
.sect-title:first-child{margin-top:0}
.rowhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.rowhead h3{margin:0;font-size:15px;font-weight:500;flex:1}
.hint{font-size:12px;color:var(--text2);line-height:1.55;margin:6px 0 0}
.lock{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)}
</style>
</head>

function initials(n){
  const w = String(n||'').trim().split(/\s+/).filter(Boolean);

  return (w.length === 1 ? w[0][0] : w[0][0] + w[w.length-1][0]).toUpperCase();
}

/** Divisiones de primer nivel de un país. EE. UU. y Colombia usan las listas de
 *  STATES (las mismas de los demás formularios); el resto, la norma ISO. */
function divisionsOf(country){
  return STATES[country] || (WORLD[country] ? WORLD[country][1] : []);
}
/** Cómo se llama la división en ese país: State, Department, Province, Region... */
function subdivLabel(country, plural){
  const one = (WORLD[country] && WORLD[country][0]) || 'State';
  if (!plural) return one;
  return /[^aeiou]y$/i.test(one) ? one.slice(0,-1)+'ies' : (/(s|sh|ch|x)$/i.test(one) ? one+'es' : one+'s');
}
/** Prefijos telefónicos con bandera, como el selector del formulario real. */
const DIAL = [{ v:'+1', t:'🇺🇸 +1' }, { v:'+57', t:'🇨🇴 +57' }];

/** Al cambiar de ficha o de pestaña, el buscador se olvida. */
function resetContacts(){ S.cSearch = ''; }

/** Dueño de unos contactos: un cliente o un representante. */
function ownerOf(kind, id){
  return kind === 'rep' ? DB.salesReps.find(x => x.id === id)
                        : DB.clients.find(x => x.id === id);
}

/** Lista vertical de contactos. El cargo es opcional: si no lo hay, no se pinta. */
function contactList(list, kind, ownerId, emptyMsg){
  if (!list.length)
    return '<div style="color:var(--text3);font-size:13px">'+esc(emptyMsg)+'</div>';
  return '<div class="ctlist">'+list.map(k =>
    '<div class="ctrow">'+
      '<span class="avatar">'+initials(k.name)+'</span>'+
      '<span class="t"><b>'+esc(k.name)+'</b>'+
        (k.role ? '<span>'+esc(k.role)+'</span>' : '')+'</span>'+
      '<button class="x" data-act="cDel" data-kind="'+kind+'" data-owner="'+ownerId+'" '+
        'data-v="'+k.id+'" title="Remove contact">'+ic('close',15)+'</button>'+
    '</div>').join('')+'</div>';
}

/**
 * Bloque completo: buscador + "+" + lista.
 * El "+" abre el modal New Contact, el mismo en las dos secciones.
 */
function contactsBlock(kind, owner){
  const term = (S.cSearch || '').trim().toLowerCase();
  const all  = owner.contacts || [];
  const list = term
    ? all.filter(k => (k.name + ' ' + (k.role||'') + ' ' + (k.email||'')).toLowerCase().indexOf(term) !== -1)
    : all;

  return '<div class="rows" style="margin-bottom:14px">'+
      '<div class="lbl">Contacts:</div>'+
      '<div class="val" style="display:flex;align-items:center;gap:14px">'+
        '<div class="pill-search" style="flex:1;max-width:420px;background:transparent;'+
          'border-bottom:1px solid var(--border-strong);border-radius:0">'+
          ic('search',16)+'<input placeholder="Search contacts" value="'+esc(S.cSearch||'')+'" '+
          'data-act="cSearch"></div>'+
        '<button class="icon-btn add" data-act="cNew" data-kind="'+kind+'" data-owner="'+owner.id+'" '+
          'title="New contact">'+ic('plus',20)+'</button></div>'+
    '</div>'+
    '<div style="margin:0 0 18px 226px">'+
      contactList(list, kind, owner.id,
        term ? 'No contacts match “'+(S.cSearch||'')+'”.' : 'No contacts yet.')+
    '</div>';
}

/** Campo de teléfono con selector de prefijo, como en el formulario real. */
function phoneField(label, ccName, ccVal, name, val){
  return '<div class="f"><span class="fic">'+ic('person',18)+'</span>'+
    '<span class="fbox"><span class="flab">'+label+'</span>'+
      '<span style="display:flex;gap:8px;align-items:center">'+
        '<select data-f="'+ccName+'" style="width:84px;flex:none">'+
          DIAL.map(d => '<option value="'+d.v+'"'+(d.v===ccVal?' selected':'')+'>'+d.t+'</option>').join('')+
        '</select>'+
        '<input data-f="'+name+'" value="'+esc(val||'')+'">'+
      '</span></span></div>';
}

/** Add Commission: el recargo manual, tal como el formulario del software. */
function surchargeModal(m){
  const d = m.data;
  const editing = !!m.edit;
  /* Al editar, la comisión automática del representante conserva su nombre:
     sale del contacto, así que Details queda bloqueado. */
  const lockLabel = editing && m.auto;
  /* Diálogo de edición como el del software: sin iconos y con el % delante del número. */

  const terr = d.territory || [];
  const divs = divisionsOf(d.country);
  const free = divs.filter(s => !terr.some(t => t.country === d.country && t.state === s));
  const one  = subdivLabel(d.country), many = subdivLabel(d.country, true);
  const cell = h => wide ? '<div class="span2">'+h+'</div>' : h;
  const whole = terr.some(t => t.country === d.country && !t.state);
  return cell(field('Country *', sel('country',
      Object.keys(WORLD).map(c => ({ v:c, t:c })), d.country), 'globe'))+
    cell(divs.length
      ? field('Add '+one.toLowerCase()+' *', sel('addState',
          [{ v:'', t: free.length ? '' : 'All '+many.toLowerCase()+' already added' }].concat(free.map(s => ({ v:s, t:s }))),
          '', !free.length), 'pin', { disabled:!free.length })
      : '<button class="btn btn-flat" data-act="repAddCountry"'+(whole?' disabled':'')+
          ' style="margin-top:14px">'+ic('plus',16)+'Add '+esc(d.country)+'</button>');

/** Clientes asociados a un representante. Única fuente de verdad. */
function clientsOfRep(repId){
  const ids = DB.salesRepClients.filter(l => l.repId === repId).map(l => l.clientId);
  return DB.clients.filter(c => ids.indexOf(c.id) !== -1);
}
function repsOfClient(clientId){
  const ids = DB.salesRepClients.filter(l => l.clientId === clientId).map(l => l.repId);
  return DB.salesReps.filter(r => ids.indexOf(r.id) !== -1);
}
function isAssigned(repId, clientId){
  return DB.salesRepClients.some(l => l.repId === repId && l.clientId === clientId);
}

/**
 * Deja salesRepClients con exactamente los vínculos indicados para un rep.
 * Quita los que sobran y crea los que faltan; los que ya existían conservan
 * su assignedAt original, para no falsear la auditoría al editar.
 */
function syncRepClients(repId, clientIds){
  DB.salesRepClients = DB.salesRepClients.filter(l =>
    l.repId !== repId || clientIds.indexOf(l.clientId) !== -1);
  clientIds.forEach(cid => {
    if (!isAssigned(repId, cid))
      DB.salesRepClients.push({ repId:repId, clientId:cid,
        assignedAt:new Date().toISOString().slice(0,10), assignedBy:'admin@esmetals.com' });
  });
}

/**
 * Tramo de comisión.
 * REGLA DEL BORDE: el umbral pertenece al tramo SUPERIOR.
 *   monto <  umbral  -> belowPct
 *   monto >= umbral  -> abovePct     (USD 1.000.000 exactos = "above")
 * Sin hueco ni solapamiento, y expresable como una sola condición.
 */
function commissionFor(rep, amountUsd){
  const t = rep.tiers;
  const above = Number(amountUsd) >= Number(t.thresholdUsd);
  const pct = above ? t.abovePct : t.belowPct;
  return { tier: above ? 'above' : 'below', pct: pct, amount: Number(amountUsd) * pct / 100 };
}

/**
 * Validación de servidor (aquí simulada). Es la MISMA comprobación que debe
 * vivir en las reglas de Firestore / Cloud Function. El frontend nunca decide.
 */
function backendValidateQuote(payload, session){
  if (session.role !== 'salesRep')
    return { ok:false, code:'ROLE', msg:'Only a sales rep can create directed quotes.' };
  const rep = DB.salesReps.find(r => r.id === session.repId);
  if (!rep)             return { ok:false, code:'NO_REP',  msg:'Sales rep not found.' };
  if (!rep.active)      return { ok:false, code:'INACTIVE',msg:'This sales rep is inactive.' };
  if (!payload.targetClientId)
    return { ok:false, code:'NO_CLIENT', msg:'Target client is required.' };
  if (!isAssigned(rep.id, payload.targetClientId))
    return { ok:false, code:'NOT_ASSIGNED',
             msg:'PERMISSION_DENIED: client '+payload.targetClientId+' is not assigned to sales rep '+rep.id+'.' };
  const client = DB.clients.find(c => c.id === payload.targetClientId);
  if (!client || !client.active)
    return { ok:false, code:'CLIENT_OFF', msg:'This client is inactive.' };
  if (!client.directedQuotes)
    return { ok:false, code:'NOT_ENABLED',
             msg:'Directed Quotes is not enabled for this client. Turn it on from the internal software.' };
  if (payload.targetContactId && !client.contacts.some(k => k.id === payload.targetContactId))
    return { ok:false, code:'BAD_CONTACT', msg:'The contact does not belong to the target client.' };
  /* Los porcentajes JAMÁS se leen del payload: se leen del documento del rep. */
  return { ok:true, rep:rep, client:client };
}

    const comm  = qs.reduce((a,q) => a + (q.commissionSnapshot ? q.commissionSnapshot.basisUsd*q.commissionSnapshot.pct/100 : 0), 0);
    body =
      '<div class="rows" style="grid-template-columns:210px 1fr;margin-bottom:18px">'+
        row('Quotes directed', String(qs.length))+
        row('Total quoted', money(total))+
        row('Commission accrued', '<b>'+money(Math.round(comm))+'</b>')+
      '</div>'+
      quotesTable(qs, { showClient:true, showRep:false, showCommission:true });
  } else {
    body =
      /* Mismo bloque de contactos que la ficha de cliente: el representante
         es una empresa y las personas viven aquí. */
      contactsBlock('rep', r)+
      /* Sin Email ni Phone de empresa: cada contacto lleva los suyos.
         Sin Status: lo dice el toggle de la cabecera. */
      /* Mismas condiciones comerciales que un cliente: el representante también
         puede levantar una cotización a su propio nombre. */
      '<div class="rows">'+
        (() => {
          /* Solo dos filas: todos los países y todos los estados añadidos, en el orden
             en que se añadieron. El "+" abre el diálogo Territory para sumar más. */
          const t  = territoryOf(r);
          const cs = t.map(x => x.country).filter((c, i, a) => a.indexOf(c) === i);
          const ds = t.filter(x => x.state).map(x => x.state);
          return row('Country', esc(cs.length ? cs.join(', ') : (r.country || '—')))+
            '<div class="lbl">State</div>'+
            '<div class="val" style="display:flex;align-items:center;gap:14px">'+
              '<span style="flex:1;max-width:420px">'+esc(ds.length ? ds.join(', ') : '—')+'</span>'+
              '<button class="icon-btn add" data-act="repStates" data-v="'+r.id+'" title="Add territory">'+
                ic('plus',20)+'</button></div>';
        })()+
        row('Currency', cur ? esc(cur.code) : '—')+
        row('Margin', r.margin+' %')+
        row('Accessories Margin', r.accMargin+' %')+
        row('Commission', r.commission+' % <span class="lock" style="margin-left:8px">'+ic('warn',13)+
            'applies when quoting as client</span>')+
        /* Solo la bandera, como en la ficha de cliente. */
        row('Language', lng ? '<span style="font-size:16px" title="'+esc(lng.name)+'">'+lng.flag+'</span>' : '—')+
        row('Standard Client', chk(r.standard, true))+
      '</div>'+
      '<hr class="hr">'+
      /* Igual que Enabled Directed Quotes en la ficha de cliente: decide si el portal
         le ofrece «Quote as Client» a este representante. */
      '<div class="rows">'+
        row('Enabled Quote as Client',
            chk(r.quoteAsClient, false, 'toggleQuoteAsClient', r.id)+
            '<div class="hint" style="margin-top:6px">Allows this sales rep to create quotes as a client. '+
            'With this turned off, only directed quotes are available.</div>')+
      '</div>'+
      '<hr class="hr">'+
      '<div class="sect-title">Commission</div>'+
      '<div class="rows">'+
        row('Threshold', '<b>'+money(r.tiers.thresholdUsd)+'</b>'+
            '<span class="lock" style="margin-left:8px">'+ic('warn',13)+
            'earned on quotes directed to a client</span>')+
        /* Los dos tramos en una sola fila: la etiqueta ya no arrastra el importe
           y los porcentajes quedan alineados uno debajo del otro. */
        row('Rate', '<div class="tiers">'+
            '<span>&lt; '+money(r.tiers.thresholdUsd)+'</span><b>'+r.tiers.belowPct+' %</b>'+
            '<span>&ge; '+money(r.tiers.thresholdUsd)+'</span><b>'+r.tiers.abovePct+' %</b>'+
          '</div>')+
      '</div>';
  }

  return '<div class="detail">'+tabs+
    '<div class="detail-body">'+
      '<div class="dtitle"><span class="ic">'+ic('building',28)+'</span><h2>'+esc(r.name)+'</h2>'+
        '<button class="toggle '+(r.active?'on':'')+'" data-act="toggleRep" data-v="'+r.id+'"><span class="knob"></span></button>'+
        menuFor('rep', r.id, 'Edit sales rep', 'editRep')+'</div>'+
      body+
    '</div></div>';
}


/**

function amt2(n, cur){

    ' '+(cur||'$');
}

const MBICON = { user:'people', rep:'person', client:'building' };

/**
 * Filtro compacto con buscador y selección múltiple. Sin nada elegido
 * equivale a «todos», que es lo que espera quien abre el tablero.
 */
function mbFilter(key, label, options){
  const sel   = S.mbSel[key];
  const term  = (S.mbQuery[key] || '').trim().toLowerCase();
  const shown = !sel.length ? label
              : sel.length === 1 ? ((options.find(o => o.v === sel[0])||{}).t || label)
              : label + ' (' + sel.length + ')';
  const list  = term ? options.filter(o => o.t.toLowerCase().indexOf(term) !== -1) : options;

  return '<div class="menu-wrap">'+
    '<button class="mb-filter'+(sel.length?' on':'')+'" data-act="mbMenu" data-v="'+key+'">'+
      ic(MBICON[key]||'people',17)+esc(shown)+
      (sel.length
        ? '<span class="x" data-act="mbClear" data-v="'+key+'" title="Clear filter">'+ic('close',15)+'</span>'
        : ic('chev-d',15))+
    '</button>'+
    (S.mbMenu === key
      ? '<div class="menu" style="min-width:270px">'+
          '<div class="menu-search">'+ic('search',15)+
            '<input placeholder="Search" value="'+esc(S.mbQuery[key]||'')+'" '+
            'data-act="mbQuery" data-k="'+key+'"></div>'+
          '<div class="menu-list">'+
            (list.length
              ? list.map(o => '<button data-act="mbPick" data-k="'+key+'" data-v="'+esc(o.v)+'">'+
                  '<span class="cbx '+(sel.indexOf(o.v)!==-1?'on':'')+'">'+
                  (sel.indexOf(o.v)!==-1?ic('check',13):'')+'</span>'+esc(o.t)+'</button>').join('')
              : '<div class="menu-empty">No matches</div>')+
          '</div>'+
          (sel.length
            ? '<div class="menu-foot"><button data-act="mbClear" data-v="'+key+'">Clear</button></div>'
            : '')+
        '</div>'
      : '')+
  '</div>';
}

/* ==========================================================================
   VISTA DE COTIZACIÓN — General Information / Costs
   Las partidas son de ejemplo: se derivan del importe de la tarjeta para que
   cada cotización muestre cifras propias y coherentes entre sí.

const ITEM_MIX = [
  { d:'Louver',             unit:'ft2', costShare:0.440, margin:0.3959 },
  { d:'Sill Pan',           unit:'ft',  costShare:0.005, margin:0.1484 },
  { d:'Mesh - Bird Screen', unit:'ft2', costShare:0.127, margin:0.1484 },
  { d:'Freight',            unit:'ft2', costShare:0.040, margin:0.1484 },
  { d:'Export Tariff',      unit:'qt',  costShare:0.049, margin:0      }
];
const CATEGORY = 'ESM 5LS - V - HP';

   SOLICITUDES DE ALTA LLEGADAS DEL PORTAL
   El portal las deja en localStorage; aquí entran a la columna Approval,
   que es donde el equipo de ES Metals las revisa. Sin importe: todavía no

/* Clave nueva: las solicitudes de prueba de la clave anterior se descartan al abrir

const REQ_KEY = 'esm_client_requests_v2';
try { localStorage.removeItem('esm_client_requests'); } catch(e){}

/* Puente con el portal: qué representantes tienen «Quote as Client» activo.
   Se publica al abrir y cada vez que cambia (casilla de la ficha o formulario). */

function loadRequests(){
  let all = [];
  try { all = JSON.parse(localStorage.getItem(REQ_KEY) || '[]'); } catch(e){ all = []; }
  all.forEach(r => {
    if (DB.board.some(q => q.code === r.id)) return;
    const isClient = r.kind === 'client';
    const where = [r.city, r.state, r.country].filter(Boolean).join(', ');
    /* Nota corta, y debajo lo que se pidió: nombre, ubicación y contactos. */
    const details = [];
    if (isClient) details.push('New client: '+r.clientName + (where ? ' · '+where : ''));
    else if (r.clientName) details.push('Client: '+r.clientName);
    (r.contacts || []).forEach(k => details.push('New contact: '+k.name+' — '+k.email));
    /* Para General Information: el contacto al que va la cotización (entre los
       nuevos) y el contacto del representante que la pidió. */
    const ki  = Math.max(0, (r.contacts || []).findIndex(k => k.name === r.contactName));
    const rep = DB.salesReps.find(x => x.id === r.repId);
    const rk  = rep ? (rep.contacts || []).find(k => k.name === r.repName) || (rep.contacts || [])[0] : null;
    /* Arriba de Approval: lo último que llega del portal se ve primero. */
    DB.board.unshift({
      code:r.id,
      /* Contacto nuevo de un cliente que ya existe: la tarjeta queda ligada a él,
         así el filtro Client la encuentra. */
      client:r.clientId || null, clientLabel:r.clientName || (r.contacts[0]||{}).name || '—',
      project:(r.quote ? r.quote.project : (isClient ? 'New client request' : 'New contact request')),
      at:r.createdAt, amt:0, cur:'$', cop:0, stage:'approval',
      rep:r.repId, owner:REVIEWER, request:r,
      contactId:'__rk'+ki, repContactId:rk ? rk.id : '',
      country:r.quote ? r.quote.country : '', state:r.quote ? r.quote.state : '',
      city:r.quote ? r.quote.city : '',
      followUp:[{ who:REVIEWER, at:r.createdAt,
        text:'Quote was not generated automatically: A request to create a new client/contact has been submitted',
        details:details }]
    });
  });
}

/* Con las dos maquetas abiertas en pestañas distintas, lo que el portal envía
   aparece sin recargar: al escribirse la solicitud y al volver a esta pestaña. */
function syncRequests(){
  const before = DB.board.length;
  loadRequests();
  if (DB.board.length !== before && S.app === 'internal') render();
}
window.addEventListener('storage', ev => { if (ev.key === REQ_KEY) syncRequests(); });
window.addEventListener('focus', syncRequests);
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncRequests(); });

function boardQuote(code){ return DB.board.find(q => q.code === code); }

/* «Sep 24/2026 7:21 am» -> «Sep 24/2026», y desplazada N días. */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function qDate(q, plusDays){
  /* El tablero escribe «Sep 24/2026» y el portal «Sep/25/2026». */
  const m = /^([A-Za-z]{3})[\s/]+(\d{1,2})\/(\d{4})/.exec(q.at || '');
  if (!m) return '—';
  const d = new Date(Number(m[3]), MONTHS.indexOf(m[1]), Number(m[2]) + (plusDays||0));
  return MONTHS[d.getMonth()]+'/'+String(d.getDate()).padStart(2,'0')+'/'+d.getFullYear();
}

/**
 * Completa los campos que la tarjeta no trae, tomándolos del cliente y del
 * representante. Solo la primera vez: después manda lo que edite el usuario.
 */
function hydrateQuote(q){
  const c = DB.clients.find(x => x.id === q.client);
  if (q.contactId === undefined) q.contactId = c && c.contacts[0] ? c.contacts[0].id : '';
  if (q.country === undefined)   q.country = c ? c.country : '';
  if (q.state === undefined)     q.state   = c ? c.state   : '';
  if (q.city === undefined)      q.city    = c ? c.city    : '';
  if (q.repContactId === undefined){
    const rep = DB.salesReps.find(x => x.id === q.rep);
    q.repContactId = rep && (rep.contacts||[])[0] ? rep.contacts[0].id : '';
  }
  /* Varios representantes: la lista y el contacto elegido de cada empresa. */
  if (!q.reps) q.reps = q.rep ? [q.rep] : [];
  if (!q.repContacts){
    q.repContacts = {};
    if (q.rep) q.repContacts[q.rep] = q.repContactId;
  }
  return q;
}

/**
 * Recargos de una cotización. Se crean la primera vez que se abre:
 * la comisión del cliente y, si hay representante, la suya al porcentaje
 * del tramo que le corresponde por el importe.
 */
function surchargesOf(q){
  if (q.surcharges) return q.surcharges;
  const c   = DB.clients.find(x => x.id === q.client);
  const list = [];
  if (c) list.push({ id:'sur_cli', label:'Commission', pct:c.commission, auto:'client' });
  /* Una comisión por empresa representante, cada una con su parte igual del total.
     El tramo se decide por el subtotal antes de recargos: si se midiera sobre el
     total ya recargado, el porcentaje se mordería la cola. */
  q.surcharges = list.concat(repSurcharges(q));
  return q.surcharges;
}

/** Recargos de comisión de los representantes de la cotización. */
function repSurcharges(q){
  return repCommissionShares(q).map(x => ({ id:'sur_rep_'+x.rep.id, label:repCommissionLabel(q, x.rep),
    pct:x.share, auto:'rep', tier:x.tier, own:x.own }));
}

/* Tasa de la maqueta, la misma que usan las tarjetas (columna COP ÷ importe en USD). */
const COP_PER_USD = 4020;

/** El umbral de los tramos está en USD: una cotización en pesos se convierte antes de comparar. */
function tierBaseUsd(q){
  return baseSubtotal(q) / (q.cur === 'COP' ? COP_PER_USD : 1);
}

/** Suma de coste + margen bruto, sin recargos. Es la base del tramo. */
function baseSubtotal(q){
  return ITEM_MIX.reduce((a,it) => a + (q.amt * it.costShare) / (1 - it.margin), 0);
}

function surFactor(q){
  return 1 + surchargesOf(q).reduce((a,s) => a + (Number(s.pct)||0)/100, 0);
}

/** Partidas calculadas, ya con los recargos repercutidos en el precio de venta. */
function quoteItems(q){
  const f   = surFactor(q);
  const qty = Math.max(1, Math.round(q.amt / 111));
  return ITEM_MIX.map((it, i) => {
    const cost = q.amt * it.costShare;
    const base = cost / (1 - it.margin);
    const sale = base * f;
    const n    = it.unit === 'qt' ? 1 : (it.unit === 'ft' ? Math.round(qty/18.5) : qty);
    return { i:i+1, d:it.d, cat:CATEGORY, unit:it.unit, qty:n,
             cost:cost, margin:it.margin*100, gm:base-cost, ppq:sale/n, sale:sale };
  });
}

  const q0 = boardQuote(S.openQuote);
  if (!q0) return '<div class="content"><div class="empty">No quote selected</div></div>';
  const q = hydrateQuote(q0);
  /* Una solicitud no tiene pestaña Costs: mientras se revisa no hay coste. */
  const tabs = '<div class="tabs">'+

    (q.request ? ''

    '<button class="'+(S.quoteTab==='followup'?'on':'')+'" data-act="qtab" data-v="followup">Follow Up</button>'+
  '</div>';
  return '<div class="content"><div class="qv">'+
    '<div class="qv-bar"><button data-act="closeQuote">'+ic('close',18)+'Quote</button></div>'+
    tabs+
    '<div class="qv-body">'+
      '<div class="qv-title"><h2>'+esc(q.project)+'</h2>'+
        (quoteLocked(q)?'':ic('edit',16))+

        '<button class="btn-save"'+(quoteLocked(q)?' disabled':'')+'>Save</button></div>'+
      (S.quoteTab === 'costs'    ? quoteCosts(q)
       : S.quoteTab === 'followup' ? quoteFollowUp(q)
       : quoteGeneral(q))+
    '</div></div></div>';
}

/** Una cotización en Follow Up queda en solo lectura. */
function quoteLocked(q){ return q.stage === 'followup'; }

const STAGE_LABEL = { bidding:'Bidding', approval:'Approval', followup:'Follow Up' };
const STAGE_COLOR = { bidding:'var(--primary)', approval:'var(--orange)', followup:'var(--amber)' };
/** Etiqueta de la comisión: el nombre de la EMPRESA representante, no el del contacto. */
function repCommissionLabel(q, rep){
  return 'Commission – ' + rep.name;
}

/** Rehace la comisión del representante tras cambiarlo. */
function syncRepSurcharge(q){
  q.surcharges = surchargesOf(q).filter(s => s.auto !== 'rep').concat(repSurcharges(q));
}

function giSel(key, opts, val, locked, ph){
  return '<select class="gi-sel" data-act="qField" data-v="'+key+'"'+(locked?' disabled':'')+'>'+
    [{ v:'', t: ph || '' }].concat(opts).map(o =>
      '<option value="'+esc(o.v)+'"'+(o.v===val?' selected':'')+'>'+esc(o.t)+'</option>').join('')+
    '</select>';
}

function quoteGeneral(q){
  const lock   = quoteLocked(q);
  let   c      = DB.clients.find(x => x.id === q.client);
  /* Solicitud del portal: mismo formato que cualquier cotización. El cliente
     nuevo y los contactos nuevos se muestran como si ya existieran. */
  const r = q.request;
  if (r){
    const extra = (r.contacts || []).map((k, i) => ({ id:'__rk'+i, name:k.name, email:k.email }));
    c = c ? Object.assign({}, c, { contacts:c.contacts.concat(extra) })
          : { id:'__req', name:r.clientName || '', city:r.city || '—',
              language:r.country === 'Colombia' ? 'ES' : 'EN', contacts:extra };
  }
  const clientOpts = DB.clients.map(x => ({v:x.id,t:x.name}))
    .concat(c && c.id === '__req' ? [{ v:'__req', t:c.name }] : []);
  const cityOpts = DB.cities.filter(x => x.active).map(x => ({v:x.name,t:x.name}));
  if (q.city && !cityOpts.some(o => o.v === q.city)) cityOpts.push({ v:q.city, t:q.city });
  const k      = c ? c.contacts.find(x => x.id === q.contactId) : null;
  const person = (name, role) => '<div class="gi-person"><span class="avatar">'+initials(name)+'</span>'+
    '<span class="t"><b>'+esc(name)+'</b><span>'+esc(role)+'</span></span></div>';
  const states = STATES[q.country] || [];

  const left =
    '<div class="gi-col">'+
      '<div class="gl">ID</div><div><span class="mono">'+(r ? '—' : esc(q.code.split('.')[0]))+'</span>'+
        '<button class="btn btn-outline" style="padding:4px 12px;margin-left:16px">'+ic('clock',14)+
        'Timeline</button></div>'+
      '<div class="gl">Account Manager</div><div>'+person(q.owner,'Account Manager')+'</div>'+
      '<div class="gl">Precon Manager</div><div>'+person(DB.staff[1],'Precon Manager')+'</div>'+
      '<div class="gl">Estimator</div><div>'+person(DB.staff[2],'Estimator')+'</div>'+
      '<div class="gl">Collaborators</div><div style="display:flex;align-items:center;gap:12px">'+
        person(DB.staff[3],'Estimator')+
        '<button class="gi-plus"'+(lock?' disabled':'')+'>'+ic('plus',16)+'</button></div>'+
      '<div class="gl">Bid Documents</div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
        (r ? '' : '<span class="gi-chip">BID DOCS - '+esc(q.code)+'.zip'+ic('close',12)+'</span>'+
          '<span class="gi-chip">Solicitud.pdf'+ic('close',12)+'</span>')+
        '<button class="gi-plus"'+(lock?' disabled':'')+'>'+ic('plus',16)+'</button></div>'+
      '<div class="gl">Attached</div><div style="display:flex;align-items:center;gap:8px">'+
        (r ? '' : '<span class="gi-chip">Schedule'+ic('close',12)+'</span>')+
        '<button class="gi-plus"'+(lock?' disabled':'')+'>'+ic('plus',16)+'</button></div>'+
      '<div class="gl">Purchase Order</div><div></div>'+
      '<div class="gl">Signed Quote</div><div></div>'+
      '<div class="gl">Change Orders</div><div>'+
        '<button class="btn btn-outline" disabled style="padding:5px 12px">'+ic('doc',14)+
        'No change orders</button></div>'+
      '<div class="gl">Tags</div><div><button class="gi-plus"'+(lock?' disabled':'')+'>'+ic('plus',16)+
        '</button></div>'+
      '<div class="gl">Country</div><div>'+giSel('country',
        Object.keys(STATES).map(x => ({v:x,t:x})), q.country, lock)+'</div>'+
      '<div class="gl">State</div><div>'+giSel('state',
        states.map(s => ({v:s,t:s})), q.state, lock)+'</div>'+
      '<div class="gl">City</div><div>'+giSel('city',
        cityOpts, q.city, lock)+'</div>'+
    '</div>';

  const right =

          (c?c.contacts:[]).map(x => ({v:x.id,t:x.name})), q.contactId, lock)+'</div>'+

             '<span class="avatar">'+initials(k.name)+'</span>'+

        return '<div class="gi-col">'+

            '<div>'+giSel('repContact:'+id, (rp.contacts || []).map(x => ({v:x.id,t:x.name})),

          (rk ? '<div class="gi-person gi-card">'+
                  '<span class="avatar">'+initials(rk.name)+'</span>'+

        '<div><div class="dl">Invitation Date</div><div class="dv">'+esc(qDate(q))+'</div></div>'+
        '<div><div class="dl">Due Date</div><div class="dv">'+esc(qDate(q,14))+'</div></div>'+
        '<div><div class="dl">Promise Date</div><div class="dv">'+esc(qDate(q,30))+'</div></div>'+
        '<div><div class="dl">Estimated Execution</div><div class="dv">'+esc(qDate(q,56))+'</div></div>'+
      '</div>'+

      '<div class="gl">View Mode</div>'+
      '<div class="vmode"><button class="toggle"><span class="knob"></span></button>Original (USD)</div>'+
    '</div>'+

    '<div class="itemhead"><span class="t">ITEMS</span>'+ic('doc',15)+
      '<div style="flex:1"></div>'+
      '<button class="btn btn-primary">'+ic('plus',16)+'New item</button></div>'+
    '<div style="overflow-x:auto"><table class="ctbl"><thead><tr>'+
      '<th>#</th><th>Description</th><th>Category</th><th class="num">Qty</th><th class="num">Cost</th>'+
      '<th class="num">Margin</th><th class="num">Gross margin</th><th class="num">Price per quantity</th>'+
      '<th class="num">Sale price</th><th>Action</th></tr></thead><tbody>'+
      items.map(x => '<tr>'+
        '<td>'+x.i+'</td><td>'+esc(x.d)+'</td><td style="color:var(--text2)">'+esc(x.cat)+'</td>'+
        '<td class="num">'+n2(x.qty)+'</td>'+

        '<td class="num">'+n2(x.sale)+' '+cur+'</td>'+
        '<td><span class="act"><button>'+ic('edit',15)+'</button><button>'+ic('close',15)+'</button>'+
          '<button>'+ic('doc',15)+'</button></span></td></tr>').join('')+
      '<tr class="tot"><td></td><td>TOTALS</td><td></td><td></td>'+
        '<td class="num">'+n2(totCost)+' '+cur+'</td>'+

/* ==========================================================================
   9. PORTAL
   ========================================================================== */
function viewPortal(){
  const isRep = S.portalRole === 'rep';
  const rep   = DB.salesReps.find(r => r.id === S.portalRepId);
  const mine  = isRep ? clientsOfRep(S.portalRepId) : [];

  /* Alcance de datos: exactamente lo que debe devolver el backend, ni un registro más. */
  let scope;
  if (isRep){
    const allowed = mine.map(c => c.id);
    scope = DB.quotes.filter(q => allowed.indexOf(q.clientId) !== -1 &&
      (q.createdByType === 'salesRep' ? q.salesRepId === S.portalRepId : true));
    if (S.filterClient !== 'all') scope = scope.filter(q => q.clientId === S.filterClient);
    if (S.filterOrigin === 'own')      scope = scope.filter(q => q.createdByType !== 'salesRep');
    if (S.filterOrigin === 'directed') scope = scope.filter(q => q.createdByType === 'salesRep');
  } else {
    scope = DB.quotes.filter(q => q.clientId === S.portalClientId);
  }

  let bar = '';
  if (isRep){
    const cityLabel = stateNames(rep);
    bar = '<div class="repbar">'+
      '<span class="who">'+ic('person',18)+'<span>Sales Rep: <b>'+esc(rep.name)+'</b> · '+
        esc(cityLabel)+' · '+mine.length+' assigned clients</span></span>'+
      '<div class="spacer"></div>'+
      '<div><label>Client</label><select data-act="fClient">'+
        '<option value="all"'+(S.filterClient==='all'?' selected':'')+'>All my clients</option>'+
        mine.map(c => '<option value="'+c.id+'"'+(S.filterClient===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('')+
      '</select></div>'+
      '<div><label>Quotes</label><div class="seg">'+
        '<button class="'+(S.filterOrigin==='all'?'on':'')+'" data-act="fOrigin" data-v="all">All</button>'+
        '<button class="'+(S.filterOrigin==='own'?'on':'')+'" data-act="fOrigin" data-v="own">Client’s own</button>'+
        '<button class="'+(S.filterOrigin==='directed'?'on':'')+'" data-act="fOrigin" data-v="directed">Directed by me</button>'+
      '</div></div></div>';
  }

  const col = (cls, title, stage, extra) => {
    const items = scope.filter(q => q.stage === stage);
    return '<div class="col '+cls+'"><div class="col-head">'+
      '<div class="t"><h4>'+title+' ('+items.length+')</h4>'+(extra||'')+'</div>'+
      '<div class="cnt">'+money(items.reduce((a,q)=>a+q.amountUsd,0))+'</div>'+
      '<div class="col-search">'+ic('search',14)+'<input placeholder="Search"></div></div>'+
      '<div class="col-body">'+
        (items.length ? items.map(qcard).join('') : '<div class="col-empty">No quotes</div>')+
      '</div></div>';
  };

  return '<div class="content"><div class="board">'+
    '<h1>Main Board</h1>'+bar+
    '<div class="cols">'+
      col('blue','Bidding Calculator','bidding',
          '<button class="btn-oncolor" data-act="newQuote">'+ic('plus',13)+'New Request</button>')+
      col('orange','Active Quotes','active',
          '<button class="mini-chip on">All</button> <button class="mini-chip">PreApproved</button>')+
      col('amber','History','history','')+
    '</div>'+
    (isRep ? securityPanel(rep, mine) : clientPanel())+
  '</div></div>';
}

function qcard(q){
  const c   = DB.clients.find(x => x.id === q.clientId);
  const k   = c ? c.contacts.find(x => x.id === q.contactId) : null;
  const rep = DB.salesReps.find(x => x.id === q.salesRepId);
  return '<div class="qcard"><div class="top"><div class="qn">'+esc(q.name)+'</div>'+
    '<button class="icon-btn" style="width:24px;height:24px">'+ic('more',16)+'</button></div>'+
    '<div class="pn">'+esc(q.project)+' · '+esc(q.product)+'</div>'+
    '<div class="dt">'+esc(q.createdAt.replace('T',' '))+(q.amountUsd?' · '+money(q.amountUsd):'')+'</div>'+
    (q.createdByType === 'salesRep'
      ? '<div class="directed">'+ic('arrow-r',14)+'<span>Directed to <b>'+esc(c?c.name:'—')+'</b>'+
        (k?' &middot; '+esc(k.name):'')+'</span></div>'+
        '<div class="dt" style="margin-top:4px">by '+esc(rep?rep.name:'—')+'</div>'
      : '')+
  '</div>';
}

function clientPanel(){
  const c = DB.clients.find(x => x.id === S.portalClientId);

function securityPanel(rep, mine){
  const forbidden = DB.clients.filter(c => !isAssigned(rep.id, c.id));
  return '<div style="margin-top:26px;max-width:900px">'+
    '<div class="sect-title">Isolation check</div>'+
    '<div class="alert info">'+ic('shield',18,'ai')+

/**
 * Territorio del representante: pares { country, state }, de uno o varios países
 * (p. ej. Florida y Georgia en EE. UU. más Bolívar en Colombia). `state` vacío
 * significa el país entero (países sin subdivisiones en la norma).
 */
function territoryOf(r){ return r.territory || []; }
/** Nombres de las divisiones, para búsquedas y subtítulos cortos. */
function statesOf(r){ return territoryOf(r).map(t => t.state || t.country); }
/** Para listas y subtítulos: todo lo añadido, en orden («Florida, Georgia, Bolívar»). */
function stateNames(r){
  const t = territoryOf(r);
  return t.length ? t.map(x => x.state || x.country).join(', ') : 'No territory';
}

/** Representantes activos que cubren un estado (de ese país, si se indica). */
function repsForState(state, country){
  if (!state) return [];
  return DB.salesReps.filter(r => r.active && territoryOf(r).some(t =>
    t.state ? (t.state === state && (!country || t.country === country))
            : (country && t.country === country)));     /* país entero */
}

/**
 * Desplegable de representantes con selección múltiple. Primero muestra los del
 * territorio (el estado elegido); "Show all sales reps" amplía la lista a todos.
 * `pfx` da nombre a las acciones: leadRep* en Leads, giRep* en General Information.
 */
function repPicker(o){
  const ui    = o.ui || {};
  const terr  = repsForState(o.state, o.country);
  const rest  = DB.salesReps.filter(r => r.active && terr.indexOf(r) === -1);
  const term  = (ui.q || '').trim().toLowerCase();
  const match = r => !term || (r.name+' '+stateNames(r)).toLowerCase().indexOf(term) !== -1;
  const names = o.ids.map(id => (DB.salesReps.find(r => r.id === id) || {}).name).filter(Boolean);
  const item  = r => {
    const on = o.ids.indexOf(r.id) !== -1;
    return '<button data-act="'+o.pfx+'Pick" data-v="'+r.id+'">'+
      '<span class="cbx '+(on?'on':'')+'">'+(on?ic('check',13):'')+'</span>'+
      '<span style="flex:1">'+esc(r.name)+'</span>'+
      '<span style="font-size:12px;color:var(--text2)">'+esc(stateNames(r))+'</span></button>';
  };
  const a = terr.filter(match), b = ui.all ? rest.filter(match) : [];
  return '<div class="rp-wrap"><div style="display:flex;align-items:flex-end;gap:10px">'+
      '<div style="flex:1;min-width:0">'+
        (o.gi
          ? '<button class="csel gi-csel" data-act="'+o.pfx+'Open" title="'+esc(names.join(', '))+'"'+(o.locked?' disabled':'')+'>'+
              '<span>'+esc(names.join(', '))+'</span>'+ic('chev-d',15)+'</button>'
          : field(o.label || 'Sales Rep', '<button class="csel" data-act="'+o.pfx+'Open" title="'+esc(names.join(', '))+'">'+
              '<span>'+esc(names.join(', '))+'</span>'+ic('chev-d',15)+'</button>', o.icon || 'person'))+
      '</div>'+
      /* La "x" quita toda la selección: hay casos sin representante aunque el territorio tenga. */
      '<button class="icon-btn" data-act="'+o.pfx+'Clear"'+(o.ids.length && !o.locked ? '' : ' disabled')+
        ' title="Remove sales reps" style="'+(o.gi ? 'width:26px;height:26px' : 'margin-bottom:16px')+'">'+
        ic('close', o.gi ? 16 : 20)+'</button>'+
    '</div>'+
    (ui.open && !o.locked
      ? '<div class="menu rp-menu">'+
          '<div class="menu-search">'+ic('search',15)+
            '<input placeholder="Search" value="'+esc(ui.q || '')+'" data-act="'+o.pfx+'Q"></div>'+
          '<div class="menu-list" style="max-height:200px">'+
            a.map(item).join('')+
            (b.length ? '<div class="rp-sep">OTHER TERRITORIES</div>'+b.map(item).join('') : '')+
            (!a.length && !b.length ? '<div class="menu-empty">No matches</div>' : '')+
          '</div>'+
          '<div class="menu-foot"><button data-act="'+o.pfx+'All">'+
            (ui.all ? 'Show territory only' : 'Show all sales reps')+'</button></div>'+
